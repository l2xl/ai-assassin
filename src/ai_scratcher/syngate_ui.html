  const view = $("doc").querySelector(`.file-view[data-path="${CSS.escape(anchor + "#" + path)}"]`);
  if (!view) return;
  const heading = frag && view.querySelector(`[data-slug="${CSS.escape(frag.toLowerCase())}"]`);
  (heading || view).scrollIntoView({ block: heading ? "start" : "nearest" });
}

async function closeFile(path) {
  const draft = drafts.get(draftKey(path, "file"));
  if (draft) await flush(draft);
  if (drafts.has(draftKey(path, "file")) && !confirm(`${path} has unsaved changes that could not be stored. Close anyway?`)) return;
  drafts.delete(draftKey(path, "file"));
  shown.delete(draftKey(path, "file"));
  for (const f of state.files.values()) if (f.anchor.startsWith(state.files.get(path).anchor + "#" + path)) state.files.delete(f.path);
  state.files.delete(path);
  if (state.editing && state.editing.endsWith("#" + path)) state.editing = null;
  renderSaveState();
  renderDoc();
}

async function reloadFiles() {
  await Promise.all([...state.files.values()].map(async (f) => {
    try { Object.assign(f, await api(`/api/file?path=${encodeURIComponent(f.path)}`), { error: null }); }
    catch (err) { f.error = err.message; }
  }));
}

function stopEditing() {
  if (!state.editing) return;
  const row = state.docRows.find((r) => r.path === state.editing), view = row && state.views.get(row.path);
  state.editing = null;
  if (view && view.byEdit && !busy(chatOf(row.uid))) hideChat(row.path);
  flushAll();
}

async function saveTests(uid, names) {
  const it = item(uid);
  try { await api(`/api/item/${uid}`, { tests: names, base: { tests: it.is_leaf ? it.bindings.map((b) => b.name) : null } }); }
  catch (err) { toast(err.message); }
  await refresh();
}

function addBinding(uid) {
  const names = item(uid).bindings.map((b) => b.name), name = $("f-add-binding").value.trim();
  if (names.includes(name)) { toast(`binding '${name || "(default)"}' already present`); return; }
  if (name && !/^[a-z0-9_]+$/.test(name)) { toast("binding names are [a-z0-9_]+"); return; }
  if ((name === "" && names.length) || names.includes("")) { toast("the default binding stands alone; name all bindings to have several"); return; }
  $("f-add-binding").value = "";
  saveTests(uid, [...names, name]);
}

// ---- runs (review / clear) ----------------------------------------------

async function run(action, uids) {
  await flushAll();
  if (drafts.size) { toast("resolve the unsaved edits first"); return; }
  try {
    const { job } = await api("/api/run", { action, uids });
    attachJob(job, `${action} ${uids.join(" ")}`);
  } catch (err) { toast(err.message); }
}

function attachJob(id, label) {
  $("console").classList.add("open");
  $("job-out").textContent = "";
  $("job-argv").textContent = label;
  $("job-state").innerHTML = '<span class="spinner"></span> <span class="status-run">running</span>';
  const es = new EventSource(`/api/job/${id}/events?token=${encodeURIComponent(TOKEN)}`);
  state.job = { id, es };
  es.onmessage = (event) => {
    const out = $("job-out");
    out.textContent += event.data + "\n";
    out.scrollTop = out.scrollHeight;
  };
  es.addEventListener("done", async (event) => {
    es.close();
    state.job = null;
    const rc = event.data;
    $("job-state").innerHTML = rc === "0" ? '<span class="status-ok">✓ exit 0</span>' : `<span class="status-fail">✗ exit ${esc(rc)}</span>`;
    await refresh();
  });
  es.onerror = () => { if (state.job && state.job.id === id) { es.close(); state.job = null; $("job-state").innerHTML = '<span class="status-fail">stream lost</span>'; } };
}

// ---- refresh loop --------------------------------------------------------

let refreshSeq = 0;
async function refresh() {
  const seq = ++refreshSeq;
  let model;
  try { model = await api("/api/tree"); } catch (err) { toast(err.message); return; }
  if (seq !== refreshSeq) return;
  state.model = model;
  try { await reloadChats(); } catch (err) { toast(err.message); return; }
  if (seq !== refreshSeq) return;
  if (state.selected && !model.items[state.selected]) state.selected = null;
  state.path = state.selected && docPath(state.selected, state.path);
  if (state.editing && !flatten(true).some((r) => r.path === state.editing) && ![...state.files.values()].some((f) => f.anchor + "#" + f.path === state.editing)) stopEditing();
  if (state.adding && !model.items[state.adding.parent]) state.adding = null;
  await reloadFiles();
  render();
}

async function poll() {
  if (document.hidden || !state.model || state.drag) return;
  try {
    const open = [...state.files.values()].filter((f) => f.text != null);
    const { fingerprint, files, chats } = await api("/api/fingerprint" + (open.length ? "?" + open.map((f) => "file=" + encodeURIComponent(f.path)).join("&") : ""));
    const stale = chats !== state.chatsVersion;
    if (stale) await reloadChats();
    if (fingerprint !== state.model.fingerprint || open.some((f) => files[f.path] !== f.sha)) await refresh();
    else if (stale) renderDoc();
  } catch (err) { /* server gone; the next interaction reports it */ }
}

// ---- events --------------------------------------------------------------

const tree = $("tree");
const rowOf = (el) => state.rows.find((r) => r.path === el.dataset.path);

tree.addEventListener("click", (event) => {
  const el = event.target.closest(".row[data-path]");
  if (!el) return;
  const row = rowOf(el), act = event.target.closest("[data-act]");
  if (event.target.closest(".twist")) { if (row.kids) toggle(row.uid); return; }
  if (act && act.dataset.act === "menu") openRowMenu(row, act);
  else if (act && act.dataset.act === "tests") openTests(row, act);
  else if (!act) select(row.uid, row.path, { panel: false });
});
// A single click selects the row and leaves the content pane alone: the double click activates the row's panel.
tree.addEventListener("dblclick", (event) => {
  const el = event.target.closest(".row[data-path]");
  if (!el || event.target.closest("[data-act], .twist")) return;
  const row = rowOf(el);
  select(row.uid, row.path, { smooth: true });
});
tree.addEventListener("keydown", (event) => {
  if (!event.target.classList.contains("new-uid")) return;
  if (event.key === "Enter") state.adding.link ? linkParent(event.target) : createChild(event.target);
  if (event.key === "Escape") { event.target.blur(); }
  event.stopPropagation();
});
tree.addEventListener("focusout", (event) => { if (event.target.classList.contains("new-uid")) stopAdding(); });

tree.addEventListener("dragstart", (event) => {
  const handle = event.target.nodeType === 1 && event.target.closest(".handle");
  if (!handle) return;
  if (filtersActive()) { event.preventDefault(); toast("clear the filters to move items", "info"); return; }
  const el = handle.closest(".row"), row = rowOf(el);
  state.drag = { uid: row.uid, from: row.parent, under: descendants(row.uid) };
  event.dataTransfer.effectAllowed = "copyMove";
  event.dataTransfer.setData("text/plain", row.uid);
  event.dataTransfer.setDragImage(el, 12, 12);
  el.classList.add("dragging");
  handle.addEventListener("dragend", endDrag, { once: true });
});
tree.addEventListener("dragover", (event) => {
  const drop = state.drag && dropAt(event);
  markDrop(drop);
  if (!drop) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = event.ctrlKey ? "copy" : "move";
});
tree.addEventListener("dragleave", (event) => { if (!tree.contains(event.relatedTarget)) markDrop(null); });
tree.addEventListener("drop", (event) => {
  const drag = state.drag, drop = drag && dropAt(event);
  endDrag();
  if (!drop) return;
  event.preventDefault();
  move(drag.uid, drag.from, drop.to, drop.before, event.ctrlKey);
});
// A rebuilt tree detaches the drag source, and its dragend may then never reach
// us; a pressed button is proof that no drag is in progress any more.
document.addEventListener("mousedown", () => { if (state.drag) endDrag(); });

document.addEventListener("input", (event) => {
  const el = event.target;
  if (!el.dataset || !el.dataset.field) return;
  edit(el.dataset.uid, el.dataset.field, el.value);
  if (el.tagName === "TEXTAREA") autoGrow(el);
});
document.addEventListener("focusout", (event) => {
  const el = event.target;
  if (state.rebuilding || !el.dataset || !el.dataset.field) return;
  const draft = drafts.get(draftKey(el.dataset.uid, el.dataset.field));
  if (draft) flush(draft);
});
document.addEventListener("visibilitychange", () => { if (document.hidden) flushAll(); else poll(); });
window.addEventListener("pagehide", flushAll);

$("save-state").addEventListener("click", flushAll);
$("conflicts").addEventListener("click", (event) => {
  const keep = event.target.dataset.keep, take = event.target.dataset.take, draft = drafts.get(keep || take);
  if (!draft) return;
  if (keep) { draft.base = draft.conflict; delete draft.conflict; flush(draft); return; }
  drafts.delete(take);
  if (document.activeElement && document.activeElement.dataset.field) document.activeElement.blur();
  renderSaveState();
  refresh();
});

const doc = $("doc");
doc.addEventListener("keydown", (event) => {
  if (!event.target.classList.contains("chat-input")) return;
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) { event.preventDefault(); sendChat(state.docRows.find((r) => r.path === event.target.closest(".block").dataset.path)); }
  event.stopPropagation();
});
doc.addEventListener("click", (event) => {
  const el = event.target.closest(".block"), view = event.target.closest(".file-view"), target = event.target;
  if (!el) return;
  const link = target.closest("a.filelink, a.jump");
  if (link) {
    event.preventDefault();
    if (link.dataset.uid) select(link.dataset.uid, null, { origin: "doc", focus: "block", smooth: true });
    else openFile(link.dataset.file, (view || el).dataset.path, link.dataset.frag);
    return;
  }
  if (view) { if (target.closest('[data-act="close"]')) closeFile(view.dataset.file); return; }  // a file view is edited on double click only
  const uid = el.dataset.uid;
  const path = el.dataset.path;
  if (target.closest(".block-ai, .block-chat")) {
    const row = state.docRows.find((r) => r.path === path), chat = chatAt(row), tool = target.closest(".msg-tools button"), fold = target.closest("[data-fold]");
    if (fold) toggleFold(fold.dataset.fold);
    else if (target.closest(".chat-input")) enterReply(el);
    else if (target.closest(".chat-reopen")) openChat(row);
    else if (target.closest(".chat-close")) hideChat(path);
    else if (target.closest(".chat-stop")) stopTurn(chat);
    else if (target.closest(".chat-send")) state.editing === path ? sendEdited(row) : sendChat(row);
    else if (target.closest(".chat-setup")) openChatMenu(chat, target.closest(".chat-setup"));
    else if (target.closest(".chat-mode")) toggleChatMode(chat, target.closest(".chat-mode").dataset.chatMode);
    else if (tool) messageTool(chat, row, tool.closest(".chat-msg"), tool);
    return;
  }
  if (target.closest(".block-status .pill")) {
    if (state.editing !== path) select(uid, path, { origin: "doc", focus: "block" });
    openStatusMenu(uid, el.querySelector(".block-status .pill"));
    return;
  }
  if (!getSelection().isCollapsed) return;
  if (state.path !== path || !state.panel) select(uid, path, { origin: "doc" });
  startEditing(path);
});
doc.addEventListener("focusin", (event) => {
  if (!state.rebuilding && event.target.classList.contains("chat-input")) enterReply(event.target.closest(".block"));
});
const statusMenu = $("status-menu");
statusMenu.addEventListener("click", (event) => {
  const { chatModel, chatEffort, chatConnector, rowAct } = event.target.dataset, chat = statusMenu.chat;
  if (rowAct) {
    statusMenu.hidePopover();
    const row = statusMenu.row;
    if (rowAct === "add") startAdding(row);
    if (rowAct === "add-parent") startLinking(row);
    if (rowAct === "remove") item(row.uid).parents.length > 1 ? unlink(row) : deleteItem(row.uid);
    return;
  }
  if (chat && (chatModel || chatEffort || chatConnector)) {
    statusMenu.hidePopover();
    if (chatConnector && chatConnector !== chat.connector) updateChat(chat.uid, chatSetup(chatConnector));
    else if (chatModel || chatEffort) updateChat(chat.uid, chatModel ? modelSetup(chat.connector, chatModel, chat.effort) : { effort: chatEffort });
    return;
  }
  const action = event.target.dataset.run, uid = statusMenu.dataset.uid;
  if (!action) return;
  statusMenu.hidePopover();
  if (action === "review" && descendants(uid).length && !confirm(`Run the bound tests of the ${leavesUnder(uid).length} leaf item(s) under ${uid} and stamp ${uid} and every item below it reviewed?`)) return;
  if (action === "clear" && !confirm(`Drop the reviewed stamp of ${uid}? Bound routine shas revert to ~.`)) return;
  run(action, [uid]);
});
$("doc-pane").addEventListener("scroll", () => { if (statusMenu.matches(":popover-open")) statusMenu.hidePopover(); });
const testsPop = $("tests-pop");
testsPop.addEventListener("click", (event) => {
  const uid = state.selected, target = event.target;
  if (target.id === "add-binding-btn") addBinding(uid);
  if (target.dataset.unbind !== undefined) {
    const bindings = item(uid).bindings, gone = bindings[Number(target.dataset.unbind)];
    if (gone.sha && !confirm(`Binding '${gone.name || "(default)"}' is frozen; removing it drops its routine sha. Remove?`)) return;
    saveTests(uid, bindings.filter((b) => b !== gone).map((b) => b.name));
  }
});
doc.addEventListener("dblclick", (event) => {
  const view = event.target.closest(".file-view");
  if (view && !event.target.closest("[data-act], a")) startEditing(view.dataset.path);
});
testsPop.addEventListener("change", (event) => {
  if (event.target.id !== "f-isleaf") return;
  const uid = state.selected, frozen = item(uid).bindings && item(uid).bindings.filter((b) => b.sha).length;
  if (!event.target.checked && frozen && !confirm(`Dropping the tests key discards ${frozen} frozen routine sha(s). Continue?`)) { event.target.checked = true; return; }
  saveTests(uid, event.target.checked ? [""] : null);
});
testsPop.addEventListener("keydown", (event) => { if (event.target.id === "f-add-binding" && event.key === "Enter") addBinding(state.selected); });

$("counts").addEventListener("click", (event) => {
  const chip = event.target.closest("[data-status]");
  if (!chip) return;
  const s = chip.dataset.status;
  state.statusFilter.has(s) ? state.statusFilter.delete(s) : state.statusFilter.add(s);
  $("counts")._html = null;
  render();
});
$("filter").addEventListener("input", () => { state.filter = $("filter").value.trim(); render(); });
$("console-close").addEventListener("click", () => $("console").classList.remove("open"));

// One screenful along `pane`, never less than one row.
function pageTarget(rows, index, dir, pane) {
  const top = (r) => pane.querySelector(`[data-path="${CSS.escape(r.path)}"]`).getBoundingClientRect().top;
  const base = top(rows[index]), span = pane.parentElement.clientHeight * 0.9;
  let i = index;
  while (rows[i + dir] && Math.abs(top(rows[i + dir]) - base) < span) i += dir;
  return rows[i === index ? Math.max(0, Math.min(rows.length - 1, index + dir)) : i];
}

// The pane holding the focus owns the keys: tree rows walk the folded outline, document blocks every item.
document.addEventListener("keydown", (event) => {
  const el = document.activeElement, typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"), inDoc = Boolean(el && el.closest("#doc"));
  if (event.key === "/" && !typing) { event.preventDefault(); $("filter").focus(); return; }
  if (!state.model) return;
  if (typing && inDoc && el.dataset.field) {
    if (event.key === "Escape") { const block = el.closest(".block"); event.preventDefault(); stopEditing(); render(); (selectedBlockEl() || block).focus({ preventScroll: true }); }
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey) && el.dataset.field === "description") { event.preventDefault(); sendEdited({ uid: el.dataset.uid, path: el.closest(".block").dataset.path }); }
    return;
  }
  if (typing) return;
  const rows = inDoc ? state.docRows : state.rows.filter((r) => !r.adding), pane = inDoc ? doc : tree;
  const index = rows.findIndex((r) => (state.path ? r.path === state.path : r.uid === state.selected)), row = rows[index];
  if (event.altKey && event.shiftKey && event.key.startsWith("Arrow")) { event.preventDefault(); if (row && !inDoc) keyboardMove(row, event.key); return; }
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || !rows.length) return;
  let target = null;
  if (event.key === "ArrowDown") target = rows[Math.min(rows.length - 1, index + 1)];
  else if (event.key === "ArrowUp") target = rows[Math.max(0, index - 1)];
  else if (event.key === "PageDown" || event.key === "PageUp") target = row ? pageTarget(rows, index, event.key === "PageDown" ? 1 : -1, pane) : rows[0];
  else if (!row) return;
  else if (event.key === "Home") target = rows[0];
  else if (event.key === "End") target = rows[rows.length - 1];
  else if (event.key === "Enter") { if (el.tagName === "BUTTON" || el.tagName === "SUMMARY") return; startEditing(); }
  else if (inDoc) return;
  else if (event.key === "ArrowRight") { if (row.kids && !row.open) toggle(row.uid); else if (row.open) target = rows[index + 1]; }
  else if (event.key === "ArrowLeft") { if (row.open) toggle(row.uid); else target = rows.find((r) => r.path === row.path.slice(0, row.path.lastIndexOf("/"))); }
  else return;
  event.preventDefault();
  if (target) select(target.uid, target.path, { origin: inDoc ? "doc" : "tree", focus: inDoc ? "block" : "row" });
});

function setTreeWidth(px) {
  $("tree-pane").style.width = px ? px + "px" : "";
  px ? sessionStorage.setItem("syngate-ui-tree-width", px) : sessionStorage.removeItem("syngate-ui-tree-width");
}

$("splitter").addEventListener("pointerdown", (event) => {
  const splitter = event.currentTarget, left = $("tree-pane").getBoundingClientRect().left;
  const drag = (move) => setTreeWidth(Math.round(move.clientX - left));
  splitter.setPointerCapture(event.pointerId);
  splitter.classList.add("dragging");
  splitter.addEventListener("pointermove", drag);
  splitter.addEventListener("pointerup", () => {
    splitter.removeEventListener("pointermove", drag);
    splitter.classList.remove("dragging");
  }, { once: true });
  event.preventDefault();
});
$("splitter").addEventListener("dblclick", () => setTreeWidth(0));
setTreeWidth(Number(sessionStorage.getItem("syngate-ui-tree-width")) || 0);

if (!TOKEN) {
  document.body.innerHTML = '<div class="empty"><h2>Missing session token</h2><p>Open the exact URL printed by <code>syngate ui</code> (it carries <code>?token=…</code>).</p></div>';
} else {
  refresh().then(() => {
    if (state.model) for (const uid of state.model.roots) state.expanded.add(uid);
    render();
  });
  setInterval(poll, 2000);
}
</script>

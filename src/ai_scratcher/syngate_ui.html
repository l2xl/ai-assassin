  Single-page frontend for syngate_ui.py: outline tree (the TOC, every row the
  status, UID and first line of an item, tests popover included) + the whole tree
  as one document of statement blocks edited in place, each holding its AI chat
  and the files it links to + review console. Every visual definition lives in
  the one stylesheet below (see SYNGATE-UI.md); the markup carries classes only.
  Vanilla JS, no build step, no external assets; talks JSON to /api/*.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synergy Context Gate</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #dde1e6; --text: #1b222b; --dim: #5b6472;
  --accent: #2e5c6e; --accent-soft: #2e5c6e18;
  --sel: #4f86c6; --sel-text: #3b6ea8;
  --sel-line: color-mix(in oklab, var(--sel) 60%, var(--line)); --sel-fill: color-mix(in oklab, var(--sel) 14%, transparent);
  --gray: #7a7f87; --yellow: #d9a63d; --yellow-text: #9a6f1c; --green: #3f7d52; --red: #a8482e; --red-soft: #a8482e14;
  --console-bg: #10151b; --console-text: #d6dde6;
  --indent: 1.05rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161b; --panel: #1a2027; --line: #2c343e; --text: #d6dde6; --dim: #8b96a5;
    --accent: #6fa8c0; --accent-soft: #6fa8c022;
    --sel: #78aee6; --sel-text: #8dbbe9;
    --yellow-text: #d9a63d;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0.3em 0.8em; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
input, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0.3em 0.5em; }
input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
code, .mono { font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

header { display: flex; align-items: center; gap: 0.8rem; padding: 0.55rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 1rem; margin: 0; white-space: nowrap; }
header .counts { display: flex; gap: 0.4rem; }
#filter { width: 14rem; }
#gate-banner { color: var(--red); font-size: 0.82rem; }
#save-state { font-size: 0.8rem; color: var(--dim); white-space: nowrap; }
#save-state.unsaved { color: var(--yellow-text); }
#save-state.failed { color: var(--red); cursor: pointer; }
.conflict { display: flex; gap: 0.6rem; align-items: center; padding: 0.35rem 1rem; font-size: 0.85rem; color: var(--yellow-text); background: #b8862b18; border-bottom: 1px solid var(--line); }
.spacer { flex: 1; }

main { flex: 1; display: flex; min-height: 0; }
#tree-pane { width: 40rem; min-width: 18rem; max-width: 75vw; flex: none; overflow: auto; padding: 0.6rem 0.4rem 2rem; }
#splitter { flex: none; width: 5px; cursor: col-resize; background: var(--line); touch-action: none; }
#splitter:hover, #splitter.dragging { background: var(--accent, #4a90d9); }
#doc-pane { flex: 1; overflow: auto; background: var(--panel); padding: 1.1rem 1.6rem 0; }
#doc { max-width: 64rem; padding-bottom: 70vh; }

.chip { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.72rem; padding: 0.12em 0.55em 0.12em 0.4em; border-radius: 3px; white-space: nowrap; border: 1px solid transparent; cursor: pointer; background: none; }
.chip .ball { display: inline-block; width: 0.62em; height: 0.62em; border-radius: 50%; margin-right: 0.35em; }
.chip.on { border-color: currentColor; }
.st-unknown { --tint: #7a7f8722; background: var(--tint); color: var(--gray); }
.st-unknown .ball { background: var(--gray); }
.st-test_passed { --tint: #3f7d5222; background: var(--tint); color: var(--green); }
.st-test_passed .ball { background: var(--green); }
.st-test_failed { --tint: #a8482e22; background: var(--tint); color: var(--red); }
.st-test_failed .ball { background: var(--red); }

/* Depth is the nesting of the markup: every level of children sits in its own .kids wrapper, indented by the pane's step. */
#tree .kids { padding-left: var(--indent); }
#doc .kids { padding-left: 1.1rem; }
.row { position: relative; display: flex; align-items: center; gap: 0.3rem; padding: 0.08rem 0.3rem 0.08rem 0.2rem; border-radius: 4px; white-space: nowrap; cursor: pointer; }
.row:hover { background: var(--accent-soft); }
.row.selected { background: var(--sel-fill); outline: 1px solid var(--sel-line); }
.row:focus-visible { outline: 2px solid var(--accent); }
.row.dragging { opacity: 0.4; }
.row[data-drop=inside] { outline: 2px solid var(--accent); background: var(--accent-soft); }
.row[data-drop=before]::before, .row[data-drop=after]::after { content: ""; position: absolute; left: 0.2rem; right: 0; height: 2px; background: var(--accent); pointer-events: none; }
.row[data-drop=before]::before { top: -1px; }
.row[data-drop=after]::after { bottom: -1px; }
@keyframes flash { from { background: var(--accent); } }
.row.flash { animation: flash 0.7s ease-out; }
.cell-node { display: inline-flex; align-items: center; gap: 0.3rem; flex: none; }
.cell-title { flex: 1; min-width: 6rem; display: flex; }
.twist { width: 1em; text-align: center; color: var(--dim); flex: none; font-size: 0.75rem; }
.handle { display: inline-flex; align-items: center; gap: 0.35rem; }
.handle[draggable=true] { cursor: grab; }
/* The composite status icon: a circle filled by the test status, the review eyes shifted to its right edge; a violated stamp lays the ❗ glyph, as tall as the circle, over the eyes outside of it. */
.status { --size: calc(1.15em + 2px); position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none; font-size: 0.8rem; line-height: 1; width: var(--size); height: var(--size); border-radius: 50%; }
.status.gray { background: var(--gray); } .status.green { background: var(--green); } .status.red { background: var(--red); }
.status .eyes { position: relative; left: 0.3em; font-size: 1em; line-height: 1; }
.status .seal { position: absolute; left: calc(100% - 0.4em); top: 50%; transform: translateY(-50%); font-size: var(--size); line-height: 1; filter: drop-shadow(0 0 1px var(--panel)); }
.status.review_violated { margin-right: 0.9em; }
.node-uid { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.82rem; }
/* The first line of the body, cut with an ellipsis exactly where the row runs out of room for it. */
.title { flex: 1; min-width: 0; font-size: 0.82rem; color: var(--dim); padding: 0.05em 0.35em; overflow: hidden; text-overflow: ellipsis; }
.dupmark { color: var(--dim); font-size: 0.72rem; font-style: italic; }
/* The one family of icon tools -- row tools, message marks, a file view's close -- hidden at rest and revealed with the element they belong to. */
.tools { display: inline-flex; flex: none; visibility: hidden; }
.row:hover .tools, .row.selected .tools, .row:focus-within .tools, .chat-msg:hover .tools, .chat-msg:focus-within .tools, .sub:hover > .tools, .sub:focus-within > .tools { visibility: visible; }
.tools button { border: none; background: none; padding: 0 0.35em; color: var(--dim); font-size: 0.9rem; line-height: 1.2; }
.tools button:hover { color: var(--accent); }
.tools button.danger:hover { color: var(--red); }
.row.adding { cursor: default; }
.new-uid { width: 14rem; font-size: 0.82rem; padding: 0.05em 0.35em; }
.block-problems { margin-top: 0.5rem; padding: 0.3rem 0.6rem; background: var(--red-soft); border-top: 1px solid var(--red); border-bottom: 1px solid var(--red); font-size: 0.78rem; color: var(--red); white-space: normal; }

/* The pane reads as one document: a block at rest shows its text, UID label and status icon only; its border -- a dim line, never the
   selection color -- and the controls mounted on it appear while the pointer is over the block or the focus is inside it.
   A fieldset's legend knocks its gap out of the border natively, so the UID label stays on the line over any (translucent) fill without a masking background. */
.block { position: relative; min-width: 0; margin: 0 0 1.05rem; padding: 0.35rem 0.95rem 0.8rem; border: 1px solid transparent; border-radius: 8px; scroll-margin-top: 0.6rem; outline: none; transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s; }
.block:hover, .block:focus-within { border-color: var(--line); }
.block-foot { visibility: hidden; }
.block:hover .block-foot, .block:focus-within .block-foot { visibility: visible; }
.block > legend { margin-left: -0.45rem; padding: 0 0.4rem; font: 600 0.66rem/1.3 "Roboto Condensed", "Liberation Sans Narrow", "Arial Narrow", system-ui, sans-serif; font-stretch: condensed; letter-spacing: 0.07em; color: var(--dim); white-space: nowrap; transition: color 0.15s; }
.block .tag { display: inline-flex; align-items: center; gap: 0.45em; }
.block .tag .status { font-size: 0.9rem; }
.block.in-sel > legend { color: var(--sel-text); }
.block.selected { background: var(--sel-fill); }
.block.editing { background: color-mix(in oklab, var(--sel) 7%, transparent); box-shadow: 0 0 0 3px var(--sel-fill); }
.block-text { font-size: 0.9rem; line-height: 1.55; overflow-wrap: anywhere; }
.block-sources { margin-top: 0.4rem; font-size: 0.78rem; color: var(--dim); }
.block-sources a { margin-right: 0.8em; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0.35em 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 0.9em 0 0.3em; line-height: 1.3; }
.md h1 { font-size: 1.25rem; } .md h2 { font-size: 1.1rem; } .md h3 { font-size: 1rem; } .md h4, .md h5, .md h6 { font-size: 0.92rem; }
.md ul, .md ol { padding-left: 1.5em; } .md li > ul, .md li > ol { margin: 0; }
.md code { font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; font-size: 0.86em; background: var(--accent-soft); padding: 0.05em 0.3em; border-radius: 3px; }
.md pre { padding: 0.5rem 0.7rem; border: 1px solid var(--line); border-radius: 4px; background: var(--accent-soft); overflow-x: auto; }
.md pre code { background: none; padding: 0; font-size: 0.8rem; }
.md blockquote { margin-left: 0; padding-left: 0.8em; border-left: 3px solid var(--line); color: var(--dim); }
.md table { border-collapse: collapse; font-size: 0.85rem; } .md th, .md td { border: 1px solid var(--line); padding: 0.2em 0.6em; vertical-align: top; text-align: left; }
.md hr { border: none; border-top: 1px solid var(--line); margin: 0.8em 0; }
.md a { color: var(--sel-text); text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }
.md a:hover { border-bottom-style: solid; }
.md a.jump { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85em; }
/* A sub-element inside the block -- a file view -- is delimited by two rules and a shift, never a rectangle; its tools sit at its left edge
   level with its first line, its name on its bottom rule. A file linked from inside a view nests below it the same way. */
.sub { position: relative; margin: 0.5rem 0 0.9rem 1.1rem; padding: 0.3rem 0 0.5rem 1.5rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.sub > .tools { position: absolute; left: 0; top: 0.3rem; }
.sub-body { max-height: 70vh; overflow: auto; }
.sub-foot { display: flex; justify-content: flex-end; margin: 0.3rem 0 -1.05rem; }
.sub-foot .pill { color: var(--dim); }
.chat-log { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 0.5rem; }
.chat-log:empty { display: none; }
/* The roles switch one message style: the user's text reads as the description, the AI's reply sits right, highlighted. */
.chat-msg { display: flex; align-items: flex-start; gap: 0.3rem; max-width: 100%; padding: 0.35rem 0.6rem 0.35rem 0.15rem; border-radius: 6px; font-size: 0.9rem; line-height: 1.55; overflow-wrap: anywhere; }
.chat-msg.user { align-self: flex-start; background: transparent; }
.chat-msg.user .msg-body { white-space: pre-wrap; }
.chat-msg.ai { align-self: flex-end; max-width: 92%; background: var(--accent-soft); }
.chat-msg.error { align-self: flex-end; color: var(--red); background: var(--red-soft); }
.chat-msg.dropped { color: var(--dim); }
.chat-msg.dropped .msg-body { opacity: 0.75; }
.msg-body { min-width: 0; flex: 1; }
.chat-msg.folded .msg-body { max-height: 1.55em; overflow: hidden; }
.msg-tools button::before { display: inline; }
.msg-fold::before { content: "▾"; } .msg-fold[aria-expanded=false]::before { content: "▸"; }
.msg-keep::before { content: "✓"; } .msg-keep[aria-checked=true] { color: var(--green); } .msg-keep[aria-checked=false]::before { content: "○"; }
.msg-child::before { content: "↳"; } .msg-sibling::before { content: "↓"; }
.chatting textarea.chat-input { min-height: 3.1em; }
.chat-pill { cursor: default; }
.chat-pill .chat-send, .chat-pill .chat-setup { cursor: pointer; }
.chat-pill .chat-send:hover, .chat-pill .chat-setup:hover { color: var(--accent); }
.chat-pill.busy .chat-send { opacity: 0.45; pointer-events: none; }
.block-ai .pill.chat-reopen { color: var(--dim); }
.chat-msg.user.agent { margin-left: 1.1rem; }
.msg-from { font: 0.66rem/1.55 ui-monospace, Menlo, Consolas, monospace; color: var(--accent); white-space: normal; }
/* A turn's activity: its header pill straddles the rule under the reply, the steps are shifted under it, every one a line unfolding to its content. */
.turn-activity { align-self: stretch; display: flex; flex-direction: column; align-items: flex-end; margin: -0.1rem 0 0.3rem 8%; border-top: 1px solid var(--line); }
.turn-head { --tint: transparent; color: var(--dim); margin-top: calc(-0.775em - 1px); }
.turn-head:hover { color: var(--accent); }
.turn-head::after { content: " ▸"; } .turn-head[aria-expanded=true]::after { content: " ▾"; }
.turn-activity .spinner { width: 0.8em; height: 0.8em; border: 1.5px solid color-mix(in oklab, currentColor 30%, transparent); border-top-color: currentColor; }
.turn-steps { align-self: stretch; padding-left: 1.1rem; font-size: 0.8rem; }
.step-line { display: block; overflow: hidden; color: var(--dim); white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
.step-line:hover { color: var(--accent); }
.step-line::before { content: "▸ "; } .step-line[aria-expanded=true]::before { content: "▾ "; }
.step-kind { margin-right: 0.5em; font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text); }
.step-detail { padding: 0.1rem 0 0.4rem 1.1rem; }
.step-label { font: 0.66rem/1.55 ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); }
.step-detail pre, .step-text { margin: 0.1rem 0 0.3rem; font-size: 0.75rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.step-detail pre { max-height: 40vh; overflow: auto; padding: 0.3rem 0.5rem; background: var(--accent-soft); font-family: ui-monospace, Menlo, Consolas, monospace; }
#status-menu .menu-label { padding: 0.3em 0.9em 0.1em; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
textarea.block-text { display: block; width: 100%; min-height: 1.55em; padding: 0; border: none; border-radius: 0; background: transparent; field-sizing: content; resize: none; font-family: inherit; }
textarea.block-text:focus { outline: none; }
/* In flow, pulled down by the bottom padding plus half a pill: the last pill line straddles the bottom border, earlier lines wrap inside. */
.block-foot { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 0.6rem; margin: 0.4rem 0 -1.4rem; }
.block-foot:hover { z-index: 20; }
.block-status, .block-ai { display: flex; flex-wrap: wrap; gap: 0.3rem 0.4rem; }
.block-status { justify-content: flex-end; margin-left: auto; }
.block-ai .pill:not(.chat-mode) { --tint: transparent; color: var(--dim); }
.pill.chat-mode.on { border-color: currentColor; }
.block-ai .pill.chat-close { color: var(--green); }
.block-chat { margin-top: 0.3rem; }
.chatting .block-chat { margin-top: 0.6rem; padding-top: 0.5rem; border-top: 1px dashed var(--line); }
.pill { position: relative; font: 0.66rem/1.55 ui-monospace, Menlo, Consolas, monospace; padding: 0 0.65em 0 0.5em; border-radius: 999px; border: 1px solid color-mix(in oklab, currentColor 40%, transparent); background: linear-gradient(var(--tint), var(--tint)), var(--panel); white-space: nowrap; cursor: pointer; }
.pill .ball { display: inline-block; width: 0.62em; height: 0.62em; border-radius: 50%; margin-right: 0.4em; }
.pill .rev { margin-left: 0.6em; padding-left: 0.6em; border-left: 1px solid color-mix(in oklab, var(--dim) 45%, transparent); color: var(--dim); }
.pill .rev.reviewed { color: var(--green); } .pill .rev.review_violated { color: var(--red); }
.pill .tip { display: none; }
.tip-test_passed { color: #7fc990; } .tip-test_failed, .tip-review_violated { color: #e58a70; } .tip-unknown { color: #9aa4b1; }
body:not(:has(#status-menu:popover-open)) .pill:hover .tip { display: block; position: absolute; right: 0; top: calc(100% + 7px); z-index: 20; width: max-content; max-width: min(44rem, 55vw); padding: 0.4rem 0.65rem; border: 1px solid #ffffff22; border-radius: 6px; background: var(--console-bg); color: var(--console-text); font-size: 0.72rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 6px 20px #0005; pointer-events: none; }
.note { color: var(--dim); font-size: 0.78rem; }
#tests-pop, #status-menu { position: fixed; inset: auto; margin: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); box-shadow: 0 8px 28px #0004; }
#tests-pop { width: min(40rem, 90vw); max-height: 70vh; overflow: auto; padding: 0.1rem 1rem 0.8rem; }
#status-menu { padding: 0.3rem; }
#status-menu:popover-open { display: flex; flex-direction: column; }
#status-menu button { border: none; background: none; padding: 0.35em 0.9em; border-radius: 5px; font-size: 0.85rem; text-align: left; white-space: nowrap; }
#status-menu button:hover:not(:disabled) { background: var(--sel-fill); color: var(--text); }
#status-menu button.danger:hover:not(:disabled) { color: var(--red); }
.section-label { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.7rem; text-transform: uppercase; color: var(--dim); margin: 0.9rem 0 0.3rem; letter-spacing: 0.04em; }
.leaf-toggle { display: inline-flex; gap: 0.4em; align-items: center; font-size: 0.85rem; }
.binding-row { display: flex; gap: 0.6rem; align-items: baseline; margin: 0.3rem 0; flex-wrap: wrap; }
.binding-row .name { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85rem; min-width: 7rem; }
.binding-row .sha { color: var(--dim); font-size: 0.75rem; }
.binding-row .loc { font-size: 0.78rem; color: var(--accent); }
.binding-row .miss { color: var(--yellow-text); font-size: 0.78rem; }
.binding-row button.unbind { border: none; background: none; padding: 0 0.15em; color: var(--dim); }
.binding-row button.unbind:hover:not(:disabled) { color: var(--red); }
.testrec summary { cursor: pointer; font-size: 0.85rem; }
.testrec pre { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 3px; padding: 0.5rem 0.7rem; font-size: 0.75rem; overflow-x: auto; }

#console { border-top: 1px solid var(--line); background: var(--console-bg); color: var(--console-text); display: none; flex-direction: column; max-height: 40vh; }
#console.open { display: flex; }
#console .bar { display: flex; gap: 0.8rem; align-items: center; padding: 0.3rem 0.9rem; font-size: 0.8rem; border-bottom: 1px solid #ffffff22; }
#console .bar .argv { font-family: ui-monospace, Menlo, Consolas, monospace; opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#console pre { flex: 1; overflow: auto; margin: 0; padding: 0.6rem 0.9rem; font-size: 0.78rem; }
#console .bar button { background: none; border-color: #ffffff44; color: var(--console-text); }
.status-run { color: var(--yellow); } .status-ok { color: #7fc990; } .status-fail { color: #e58a70; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { display: inline-block; width: 0.85em; height: 0.85em; border: 2px solid #ffffff44; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -0.1em; }

#toasts { position: fixed; top: 3.2rem; right: 1rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 30; }
.toast { background: var(--panel); border: 1px solid var(--red); color: var(--red); border-radius: 4px; padding: 0.5rem 0.9rem; max-width: 26rem; font-size: 0.85rem; box-shadow: 0 2px 10px #0003; }
.toast.info { border-color: var(--accent); color: var(--accent); }
.empty { color: var(--dim); margin-top: 3rem; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Synergy Context Gate</h1>
  <span class="counts" id="counts"></span>
  <span id="gate-banner" hidden></span>
  <span class="spacer"></span>
  <span id="save-state"></span>
  <input id="filter" type="search" placeholder="filter uid / text  ( / )">
</header>
<div id="conflicts"></div>
<main>
  <nav id="tree-pane"><div id="tree" role="treegrid" aria-label="Syngate tree"></div></nav>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-controls="tree-pane" title="drag to resize, double-click to reset"></div>
  <section id="doc-pane"><div id="doc" aria-label="Syngate document"></div></section>
</main>
<footer id="console">
  <div class="bar">
    <span id="job-state"></span>
    <span class="argv" id="job-argv"></span>
    <span class="spacer"></span>
    <button id="console-close">close</button>
  </div>
  <pre id="job-out"></pre>
</footer>
<div id="toasts"></div>
<div id="tests-pop" popover></div>
<div id="status-menu" popover role="menu"></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const SAVE_IDLE_MS = 1000, SAVE_MAX_MS = 5000, HOVER_EXPAND_MS = 600;
const CALM = matchMedia("(prefers-reduced-motion: reduce)");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const state = {
  model: null,          // /api/tree payload
  selected: null,       // uid
  path: null,           // row / block path of the selected instance (a multi-parent item has one per parent)
  panel: true,          // whether the selection activates its content panel, or stays a tree row only
  editing: null,        // path of the document block in editing mode
  files: new Map(),     // project files opened from links: path -> {path, anchor: the block or file view holding it, text, sha, writable, error}
  // The items' chats as the server holds them, by UID: {uid, log, session, connector, model, effort, modes, turn: "<UID>:<n>" while one runs}
  chats: new Map(),
  chatsVersion: null,
  // Where this tab shows an item's chat: block path -> {uid, byEdit: opened by the editor and abandoned with it unless sent}
  views: new Map(JSON.parse(sessionStorage.getItem("syngate-ui-chat-views") || "[]")),
  watching: false,      // whether this tab's long poll on the chats is out
  unfolded: new Set(),  // turn activities and steps unfolded in this tab: "<UID>:<log index of the reply>/<step index path>"
  expanded: new Set(JSON.parse(sessionStorage.getItem("syngate-ui-expanded") || "[]")),
  filter: "",
  statusFilter: new Set(),
  rows: [],             // flattened visible tree, in DOM order
  treeSig: null,        // row structure the DOM was last built for
  docRows: [],          // the whole (filtered) tree unfolded: one document block per row
  docSig: null,
  adding: null,         // {parent, path} while the inline new-child row is open
  drag: null,           // {uid, from, under}
  job: null,
  savedAt: null,
};
// Autosave: drafts holds the fields typed but not yet stored, keyed "uid field";
// shown holds the server value each text field was last filled from -- the
// compare-and-swap base, so an edit never overwrites what the user has not seen.
const drafts = new Map();
const shown = new Map();
const draftKey = (uid, field) => uid + " " + field;

function setHtml(el, html) {
  if (el._html === html) return;
  el.innerHTML = html;
  el._html = html;
}

async function api(path, payload) {
  const sent = payload === undefined ? undefined : JSON.stringify(payload);
  const res = await fetch(path, {
    method: sent === undefined ? "GET" : "POST",
    headers: { "X-Syngate-Token": TOKEN, ...(sent !== undefined && { "Content-Type": "application/json" }) },
    body: sent,
    keepalive: sent !== undefined && sent.length < 60000,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || `${res.status} on ${path}`), { status: res.status, body });
  return body;
}

function toast(message, cls = "") {
  const el = document.createElement("div");
  el.className = "toast " + cls;
  el.textContent = message;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 6500);
}

const item = (uid) => state.model.items[uid];
const filtersActive = () => Boolean(state.filter || state.statusFilter.size);
function persistExpanded() { sessionStorage.setItem("syngate-ui-expanded", JSON.stringify([...state.expanded])); }

// ---- autosave ------------------------------------------------------------

function serverValue(uid, field) {
  return field === "file" ? state.files.get(uid)?.text ?? "" : item(uid).description_raw;
}
function currentText(uid, field) { const draft = drafts.get(draftKey(uid, field)); return draft ? draft.value : serverValue(uid, field); }

function syncText(el) {
  const { uid, field } = el.dataset, key = draftKey(uid, field), draft = drafts.get(key);
  if (document.activeElement === el) return;
  if (draft) { if (el.value !== draft.value) el.value = draft.value; return; }
  const raw = serverValue(uid, field), text = field === "description" ? raw.replace(/\n$/, "") : raw;
  if (el.value !== text) el.value = text;
  shown.set(key, raw);
}

function autoGrow(el) {
  if (CSS.supports("field-sizing", "content")) return;
  el.style.height = "auto";
  el.style.height = el.scrollHeight + 2 + "px";
}

function edit(uid, field, value) {
  const key = draftKey(uid, field);
  const draft = drafts.get(key) || { key, uid, field, base: shown.has(key) ? shown.get(key) : serverValue(uid, field), since: Date.now() };
  draft.value = value;
  drafts.set(key, draft);
  clearTimeout(draft.timer);
  draft.timer = setTimeout(() => flush(draft), Math.max(0, Math.min(SAVE_IDLE_MS, draft.since + SAVE_MAX_MS - Date.now())));
  renderSaveState();
}

// A flush joins the save already in flight, so awaiting it means the draft is stored (or failed), never skipped.
function flush(draft) {
  clearTimeout(draft.timer);
  if (!draft.saving && !("conflict" in draft) && drafts.get(draft.key) === draft) draft.saving = store(draft);
  return draft.saving || Promise.resolve();
}

async function store(draft) {
  draft.error = null;
  renderSaveState();
  const sent = draft.value;
  try {
    const result = draft.field === "file" ? await api("/api/file", { path: draft.uid, text: sent, base: draft.base })
      : await api(`/api/item/${draft.uid}`, { [draft.field]: sent, base: { [draft.field]: draft.base } });
    draft.base = result.stored[draft.field];
    if (draft.field === "file" && state.files.has(draft.uid)) Object.assign(state.files.get(draft.uid), { text: draft.base, sha: result.sha });
    shown.set(draft.key, draft.base);
    draft.saving = null;
    state.savedAt = new Date();
    if (draft.value === sent) drafts.delete(draft.key);
    else { draft.since = Date.now(); draft.timer = setTimeout(() => flush(draft), SAVE_IDLE_MS); }
    await refresh();
  } catch (err) {
    draft.saving = null;
    if (err.status === 409) draft.conflict = err.body.current[draft.field];
    else draft.error = err.message;
  }
  renderSaveState();
}

const flushAll = () => Promise.all([...drafts.values()].map(flush));

function renderSaveState() {
  const all = [...drafts.values()], el = $("save-state");
  const failed = all.find((d) => d.error);
  el.className = failed ? "failed" : all.length ? "unsaved" : "";
  el.title = failed ? failed.error : "";
  el.textContent = failed ? "✗ save failed — click to retry" : all.some((d) => "conflict" in d) ? "⚠ edit conflict"
    : all.some((d) => d.saving) ? "saving…" : all.length ? "● unsaved" : state.savedAt ? "✓ saved " + state.savedAt.toLocaleTimeString() : "";
  setHtml($("conflicts"), all.filter((d) => "conflict" in d).map((d) =>
    `<div class="conflict">⚠ <span class="mono">${esc(d.uid)}</span> ${esc(d.field)} changed on disk while you were editing it`
    + `<button data-keep="${esc(d.key)}">keep mine</button><button data-take="${esc(d.key)}">take theirs</button></div>`).join(""));
}

// ---- tree ----------------------------------------------------------------

function visibleSet() {
  // An item stays visible when itself or any descendant matches the filters.
  const m = state.model, needle = state.filter.toLowerCase(), statuses = state.statusFilter;
  const memo = new Map();
  const selfMatch = (uid) => {
    const it = m.items[uid];
    const text = !needle || uid.toLowerCase().includes(needle) || it.description_raw.toLowerCase().includes(needle);
    const status = !statuses.size || statuses.has(it.test);
    return text && status;
  };
  const visit = (uid, trail) => {
    if (memo.has(uid)) return memo.get(uid);
    if (trail.has(uid)) return false;
    trail.add(uid);
    const ok = selfMatch(uid) || m.items[uid].children.some((c) => visit(c, trail));
    trail.delete(uid);
    memo.set(uid, ok);
    return ok;
  };
  const visible = new Set();
  for (const uid of Object.keys(m.items)) if (visit(uid, new Set())) visible.add(uid);
  return visible;
}

function flatten(unfolded = false) {
  const m = state.model, visible = visibleSet(), forced = unfolded || filtersActive(), rows = [];
  const walk = (uid, parent, trail) => {
    if (!visible.has(uid)) return;
    const kids = m.items[uid].children.filter((c) => visible.has(c));
    const cycle = trail.includes(uid), path = [...trail, uid].join("/");
    const linking = Boolean(!unfolded && state.adding && state.adding.link && state.adding.path === path);
    const adding = !linking && Boolean(!unfolded && state.adding && state.adding.path === path);
    const open = !cycle && (adding || (kids.length > 0 && (forced || state.expanded.has(uid))));
    rows.push({ uid, parent, path, depth: trail.length, kids: kids.length, open, cycle });
    if (linking) rows.push({ adding: true, link: true, parent: uid, path: path + "/^", depth: trail.length + 1 });
    if (!open) return;
    for (const c of kids) walk(c, uid, [...trail, uid]);
    if (adding) rows.push({ adding: true, parent: uid, path: path + "/+", depth: trail.length + 1 });
  };
  for (const uid of [...m.roots, ...m.unreachable]) walk(uid, null, []);
  return rows;
}

// The rows of a pane as nested markup: each deeper run of rows sits in a .kids wrapper, so the depth is the nesting and no row carries a style of its own.
function nested(rows, html) {
  let out = "", depth = 0;
  for (const row of rows) {
    for (; depth < row.depth; depth++) out += '<div class="kids">';
    for (; depth > row.depth; depth--) out += "</div>";
    out += html(row);
  }
  return out + "</div>".repeat(depth);
}

function rowHtml(row) {
  if (row.link) {
    return `<div class="row adding" role="row"><span class="twist">⇑</span>`
      + `<input class="new-uid mono" data-focus-key="adding" list="parent-uids" spellcheck="false" placeholder="PARENT-UID">`
      + `<datalist id="parent-uids">${parentCandidates(row.parent).map((u) => `<option value="${esc(u)}">`).join("")}</datalist>`
      + `<span class="note">Enter links as one more parent · Esc cancels</span></div>`;
  }
  if (row.adding) {
    return `<div class="row adding" role="row"><span class="twist">·</span>`
      + `<input class="new-uid mono" data-focus-key="adding" spellcheck="false" placeholder="NEW-UID">`
      + `<span class="note">Enter creates · Esc cancels</span></div>`;
  }
  const uid = esc(row.uid), path = esc(row.path);
  return `<div class="row" role="row" tabindex="-1" aria-level="${row.depth + 1}" data-uid="${uid}" data-path="${path}" data-focus-key="row:${path}">`
    + `<span class="cell-node" role="gridcell"><span class="twist"></span>`
    + `<span class="handle"><span class="status"></span><span class="node-uid">${uid}</span></span></span>`
    + `<span class="cell-title" role="gridcell"><span class="title"></span></span>`
    + `<span class="tools" role="gridcell">${feature("test") ? '<button data-act="tests" title="tests &amp; review">T</button>' : ""}<button data-act="menu" title="add parent · add child · remove" aria-haspopup="menu">⋯</button></span>`
    + (row.cycle ? '<span class="dupmark">(cycle)</span>' : "") + "</div>";
}

// The tree's feature switches (root item `test: enabled` / `review: enabled`): a feature that is off has no affordances on the page.
const feature = (name) => state.model.features[name];

const TEST_FILL = { test_passed: "green", test_failed: "red" };

// The common status icon of a tree row and of a content panel: a square filled by the test status wrapping the review eyes, each axis only while its feature is on.
function decorateLabel(el, it) {
  const mark = el.querySelector(".status"), test = feature("test") && it.test, review = feature("review") && it.review;
  mark.className = "status " + (TEST_FILL[test] || "gray") + (review ? " " + review : "");
  mark.hidden = !test && !review;
  mark.title = [test, review].filter(Boolean).map((axis) => axis.replace(/_/g, " ")).join(" · ");
  setHtml(mark, review && review !== "not_reviewed" ? '<span class="eyes">👀</span>' + (review === "review_violated" ? '<span class="seal">❗</span>' : "") : "");
}

function decorateRow(el, row) {
  if (row.adding) return;
  const it = item(row.uid), selected = row.uid === state.selected;
  el.classList.toggle("selected", selected);
  el.setAttribute("aria-selected", selected);
  if (row.kids) el.setAttribute("aria-expanded", row.open); else el.removeAttribute("aria-expanded");
  el.querySelector(".twist").textContent = row.kids ? (row.open ? "▾" : "▸") : "·";
  decorateLabel(el, it);
  const handle = el.querySelector(".handle");
  handle.draggable = it.parents.length > 0;
  handle.title = it.path + (handle.draggable ? " — drag to move, Ctrl+drag to add one more parent" : "");
  const title = el.querySelector(".title");
  title.textContent = title.title = it.title;
  if (state.flash === row.uid) el.classList.add("flash");
}

function selectedRowEl() {
  const tree = $("tree");
  return (state.path && tree.querySelector(`.row[data-path="${CSS.escape(state.path)}"]`))
    || (state.selected && tree.querySelector(`.row[data-uid="${CSS.escape(state.selected)}"]`)) || null;
}

function renderTree() {
  const m = state.model, tree = $("tree");
  state.rows = flatten();
  const sig = state.rows.map((r) => r.path + (r.open ? "+" : "")).join("\n");
  let focus = null;
  if (sig !== state.treeSig) {
    const active = document.activeElement;
    if (tree.contains(active) && active.dataset.focusKey) focus = { key: active.dataset.focusKey, value: active.value, start: active.selectionStart, end: active.selectionEnd };
    state.rebuilding = true;
    tree.innerHTML = nested(state.rows, rowHtml) || '<div class="empty">nothing matches the filter</div>';
    state.rebuilding = false;
    state.treeSig = sig;
  }
  tree.querySelectorAll(".row").forEach((el, i) => decorateRow(el, state.rows[i]));
  state.flash = null;
  if (focus) {
    const el = tree.querySelector(`[data-focus-key="${CSS.escape(focus.key)}"]`);
    if (el) {
      if (focus.key === "adding") el.value = focus.value;
      el.focus({ preventScroll: true });
      if (el.setSelectionRange && focus.start != null) el.setSelectionRange(focus.start, focus.end);
    }
  }
  setHtml($("counts"), ["test_failed", "unknown", "test_passed"]
    .filter((s) => m.counts[s])
    .map((s) => '<button class="chip st-' + s + (state.statusFilter.has(s) ? " on" : "") + '" data-status="' + s + '">'
      + '<span class="ball"></span>' + m.counts[s] + " " + s.replace(/_/g, " ") + "</button>").join(""));
  const gate = $("gate-banner");
  const problemItems = Object.values(m.items).filter((it) => it.problems.length).length;
  const troubles = m.load_errors.length + problemItems;
  gate.hidden = !troubles;
  gate.title = m.load_errors.join("\n");
  if (troubles) gate.textContent = "⛔ gate: " + (m.load_errors.length ? m.load_errors.length + " tree error(s), " : "") + problemItems + " item(s) with validation problems";
}

function toggle(uid) {
  state.expanded.has(uid) ? state.expanded.delete(uid) : state.expanded.add(uid);
  persistExpanded();
  renderTree();
}

function docPath(uid, path) {
  const rows = flatten(true);
  return (rows.find((r) => r.path === path) || rows.find((r) => r.uid === uid) || { path: null }).path;
}

const inView = (el, pane) => {
  const box = el.getBoundingClientRect(), frame = pane.getBoundingClientRect();
  return box.top >= frame.top && box.bottom <= frame.bottom;
};

// origin "tree": the document scrolls the block to its top unless it is already in view; origin "doc": the
// tree unfolds down to the row and both panes scroll only as far as needed.
function select(uid, path = null, { focus = null, origin = "tree", smooth = false, panel = true } = {}) {
  path = docPath(uid, path);
  if (state.editing !== path) stopEditing();
  state.selected = uid;
  state.path = path;
  state.panel = panel;
  if (origin === "doc" && path) {
    for (const above of path.split("/").slice(0, -1)) state.expanded.add(above);
    persistExpanded();
  }
  render();
  const row = selectedRowEl(), block = panel ? selectedBlockEl() : null;
  if (row) row.scrollIntoView({ block: "nearest" });
  if (block && !inView(block, $("doc-pane"))) block.scrollIntoView(origin === "doc" ? { block: "nearest" } : { block: "start", behavior: smooth && !CALM.matches ? "smooth" : "auto" });
  if (focus === "row" && row) row.focus({ preventScroll: true });
  if (focus === "block" && block) block.focus({ preventScroll: true });
}

// ---- structure edits: add child / delete / unlink / move -----------------

function suggestUid(parent) {
  const numbered = item(parent).children.map((c) => c.match(/^(.*-)\d+$/)).filter(Boolean);
  const prefix = numbered.length ? numbered[numbered.length - 1][1] : parent.replace(/-?\d*$/, "-");
  let max = 0, width = 3;
  for (const uid of Object.keys(state.model.items)) {
    if (!uid.startsWith(prefix) || !/^\d+$/.test(uid.slice(prefix.length))) continue;
    const digits = uid.slice(prefix.length);
    if (Number(digits) >= max) { max = Number(digits); width = digits.length; }
  }
  return prefix + String(max + 1).padStart(width, "0");
}

function startAdding(row) {
  state.adding = { parent: row.uid, path: row.path };
  renderTree();
  const input = $("tree").querySelector(".new-uid");
  input.value = suggestUid(row.uid);
  input.focus();
  input.select();
}

// An in-place search row under the item takes the UID of an existing item to link as one more parent.
function startLinking(row) {
  state.adding = { parent: row.uid, path: row.path, link: true };
  renderTree();
  $("tree").querySelector(".new-uid").focus();
}

function parentCandidates(uid) {
  const it = item(uid), under = descendants(uid);
  return Object.keys(state.model.items).filter((u) => u !== uid && !under.has(u) && !it.parents.includes(u)).sort();
}

function linkParent(input) {
  const uid = state.adding.parent, to = input.value.trim();
  state.adding = null;
  move(uid, null, to, null, true);
}

function stopAdding() {
  if (!state.adding || state.creating || state.rebuilding) return;
  state.adding = null;
  renderTree();
}

async function createChild(input) {
  const parent = state.adding.parent, uid = input.value.trim(), kids = item(parent).children;
  const last = kids.length ? item(kids[kids.length - 1]) : null;
  state.creating = true;
  try {
    await api("/api/new", { uid, parents: [parent], dir: (last || item(parent)).folder, kind: "leaf", order: last ? last.order + 10 : 0 });
    state.adding = null;
    state.filter = $("filter").value = "";
    state.statusFilter.clear();
    state.expanded.add(parent);
    persistExpanded();
    await refresh();
    select(uid, null, { focus: "block" });
    startEditing();
  } catch (err) { toast(err.message); input.focus(); }
  finally { state.creating = false; }
}

async function deleteItem(uid) {
  if (!confirm(`Delete ${uid} (${item(uid).path})?`)) return;
  try {
    await api(`/api/delete/${uid}`, {});
    for (const key of [...drafts.keys()]) if (key.startsWith(uid + " ")) { clearTimeout(drafts.get(key).timer); drafts.delete(key); }
    if (state.selected === uid) state.selected = state.path = state.editing = null;
    renderSaveState();
    await refresh();
  } catch (err) { toast(err.message); }
}

async function unlink(row) {
  const it = item(row.uid);
  if (it.reviewed && !confirm(`${row.uid} is reviewed: changing its parents clears its review. Unlink from ${row.parent} anyway?`)) return;
  try {
    await api(`/api/item/${row.uid}`, { parents: it.parents.filter((p) => p !== row.parent), base: { parents: it.parents } });
    state.path = null;
    await refresh();
  } catch (err) { toast(err.message); }
}

function descendants(uid) {
  const under = new Set(), queue = [...item(uid).children];
  while (queue.length) {
    const next = queue.pop();
    if (under.has(next)) continue;
    under.add(next);
    queue.push(...item(next).children);
  }
  return under;
}

async function move(uid, from, to, before, link = false) {
  if (filtersActive()) { toast("clear the filters to move items", "info"); return; }
  const it = item(uid), refocus = $("tree").contains(document.activeElement);
  try {
    if (!it.parents.includes(to)) {
      if (it.reviewed && !confirm(`${uid} is reviewed: a new parent clears its review. ${link ? "Link" : "Move"} under ${to} anyway?`)) return;
    }
    await api(`/api/move/${uid}`, { from, to, before, link });
    state.expanded.add(to);
    persistExpanded();
    state.flash = uid;
    await refresh();
    if (state.selected === uid) select(uid, [...state.rows].find((r) => r.uid === uid && r.parent === to)?.path || null, { focus: refocus ? "row" : null });
  } catch (err) { toast(err.message); }
}

// Keyboard twin of drag-and-drop: Alt+Shift+arrows move the selected row among
// its siblings, indent it under the previous sibling or outdent it after its parent.
function keyboardMove(row, key) {
  if (!row.parent) return;
  const sibs = item(row.parent).children, i = sibs.indexOf(row.uid);
  if (key === "ArrowUp" && i > 0) move(row.uid, row.parent, row.parent, sibs[i - 1]);
  if (key === "ArrowDown" && i < sibs.length - 1) move(row.uid, row.parent, row.parent, sibs[i + 2] ?? null);
  if (key === "ArrowRight" && i > 0) move(row.uid, row.parent, sibs[i - 1], null);
  if (key === "ArrowLeft") {
    const above = state.rows.find((r) => r.path === row.path.slice(0, row.path.lastIndexOf("/")));
    if (!above || !above.parent) return;
    const uncles = item(above.parent).children;
    move(row.uid, row.parent, above.parent, uncles[uncles.indexOf(above.uid) + 1] ?? null);
  }
}

function dropAt(event) {
  const target = event.target.nodeType === 1 ? event.target : event.target.parentElement;
  const el = target && target.closest(".row[data-path]"), drag = state.drag;
  const row = el && state.rows.find((r) => r.path === el.dataset.path);
  if (!row || row.cycle) return null;
  const rect = el.getBoundingClientRect(), y = (event.clientY - rect.top) / rect.height;
  const zone = !row.parent ? "inside" : y < 0.25 ? "before" : y > 0.75 ? "after" : "inside";
  const into = zone === "inside" || (zone === "after" && row.open);
  const to = into ? row.uid : row.parent;
  if (row.uid === drag.uid || to === drag.uid || drag.under.has(to)) return null;
  const sibs = item(to).children.filter((c) => c !== drag.uid);
  const before = zone === "inside" ? null : zone === "before" ? row.uid : (into ? sibs[0] : sibs[sibs.indexOf(row.uid) + 1]) ?? null;
  return { el, row, zone, to, before };
}

function markDrop(drop) {
  const marked = $("tree").querySelector("[data-drop]");
  if (marked && (!drop || marked !== drop.el)) delete marked.dataset.drop;
  if (drop) drop.el.dataset.drop = drop.zone;
  const hover = drop && drop.zone === "inside" && drop.row.kids && !drop.row.open ? drop.row.uid : null;
  if (hover === state.hover) return;
  clearTimeout(state.hoverTimer);
  state.hover = hover;
  if (hover) state.hoverTimer = setTimeout(() => { state.expanded.add(hover); persistExpanded(); renderTree(); }, HOVER_EXPAND_MS);
}

function endDrag() {
  state.drag = null;
  markDrop(null);
  $("tree").querySelectorAll(".dragging").forEach((el) => el.classList.remove("dragging"));
}

// ---- document: every item a titled block; the selected one edits in place --

// ---- markdown: escape first, then a small CommonMark subset over the escaped text; never raw HTML --

const UID_TAG_RE = /\[([A-Z][A-Z_]*(?:-[A-Z0-9_]+)*)\]/g;
const dirname = (path) => path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "";
const slug = (text) => text.toLowerCase().replace(/<[^>]*>/g, "").replace(/&[a-z#0-9]+;/g, "").replace(/[^\w\- ]/g, "").trim().replace(/\s+/g, "-");

function resolvePath(base, rel) {
  const parts = rel.startsWith("/") || !base ? [] : base.split("/");
  for (const seg of rel.split("/")) {
    if (!seg || seg === ".") continue;
    if (seg === "..") parts.pop(); else parts.push(seg);
  }
  return parts.join("/");
}

// Links point into the project unless they carry an allowed scheme; other schemes degrade to text.
function linkHtml(label, href, base) {
  if (/^(https?:|mailto:)/i.test(href)) return `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`;
  if (/^[a-z][a-z0-9+.-]*:/i.test(href)) return esc(label);
  const [target, frag] = href.split("#"), path = target ? resolvePath(base, target) : "";
  return `<a class="filelink" data-file="${esc(path)}" data-frag="${esc(frag || "")}" title="${esc(path)}">${esc(label)}</a>`;
}

function inline(raw, base) {
  const parts = [], hold = (html) => { parts.push(html); return `\u0000${parts.length - 1}\u0000`; };
  const text = raw.replace(/`([^`\n]+)`/g, (_, code) => hold(`<code>${esc(code)}</code>`))
    .replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (_, label, href) => hold(linkHtml(label, href, base)))
    .replace(/(^|[\s(])(https?:\/\/[^\s<>)]+)/g, (_, pre, url) => pre + hold(linkHtml(url, url, base)))
    .replace(UID_TAG_RE, (m, uid) => state.model.items[uid] ? hold(`<a class="jump" data-uid="${esc(uid)}">${esc(uid)}</a>`) : m);
  return esc(text).replace(/\*\*(\S(?:.*?\S)?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^\w*])\*(\S(?:[^*\n]*?\S)?)\*(?![\w*])/g, "$1<em>$2</em>")
    .replace(/\u0000(\d+)\u0000/g, (_, i) => parts[i]);
}

function md(text, base) {
  const lines = text.split("\n"), out = [];
  const listAt = (line) => /^(\s*)([-*]|\d+[.)])\s+(.*)$/.exec(line);
  const blockStart = (line) => /^(```|#{1,6}\s|>|\||(-{3,}|\*{3,})\s*$)/.test(line) || listAt(line);
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*$/.test(line)) { i++; continue; }
    if (line.startsWith("```")) {
      const buf = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) buf.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const heading = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line);
    if (heading) { const html = inline(heading[2], base); out.push(`<h${heading[1].length} data-slug="${esc(slug(html))}">${html}</h${heading[1].length}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (line.startsWith(">")) {
      const buf = [];
      for (; i < lines.length && lines[i].startsWith(">"); i++) buf.push(lines[i].replace(/^>\s?/, ""));
      out.push(`<blockquote>${md(buf.join("\n"), base)}</blockquote>`);
      continue;
    }
    if (line.startsWith("|") && /^\|?\s*:?-+/.test(lines[i + 1] || "")) {
      const cells = (row) => row.replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim(), base));
      out.push(`<table><tr>${cells(line).map((c) => `<th>${c}</th>`).join("")}</tr>`);
      for (i += 2; i < lines.length && lines[i].startsWith("|"); i++) out.push(`<tr>${cells(lines[i]).map((c) => `<td>${c}</td>`).join("")}</tr>`);
      out.push("</table>");
      continue;
    }
    if (listAt(line)) {
      const stack = [];
      for (; i < lines.length && !/^\s*$/.test(lines[i]); i++) {
        const at = listAt(lines[i]);
        if (!at) { out.push(" " + inline(lines[i].trim(), base)); continue; }
        const indent = at[1].length, tag = /\d/.test(at[2]) ? "ol" : "ul";
        while (stack.length && indent < stack[stack.length - 1].indent) out.push(`</li></${stack.pop().tag}>`);
        if (stack.length && indent === stack[stack.length - 1].indent) out.push("</li>");
        else { stack.push({ indent, tag }); out.push(`<${tag}>`); }
        out.push(`<li>${inline(at[3], base)}`);
      }
      while (stack.length) out.push(`</li></${stack.pop().tag}>`);
      continue;
    }
    const buf = [];
    for (; i < lines.length && !/^\s*$/.test(lines[i]) && !(buf.length && blockStart(lines[i])); i++) buf.push(lines[i].trim());
    out.push(`<p>${inline(buf.join(" "), base)}</p>`);
  }
  return out.join("");
}

// An item's block: its statement, the files it links to, its chat, and the controls on its bottom border.
function blockHtml(row) {
  const uid = esc(row.uid);
  return `<fieldset class="block" tabindex="-1" data-uid="${uid}" data-path="${esc(row.path)}">`
    + `<legend><span class="tag"><span class="status"></span><span>${uid}</span></span></legend>`
    + `<div class="block-body"></div><div class="block-files"></div><div class="block-chat"></div>`
    + `<div class="block-foot"><div class="block-ai"></div><div class="block-status"></div></div></fieldset>`;
}

function fileViewHtml(f, path) {
  return `<div class="sub file-view" data-file="${esc(f.path)}" data-path="${esc(path)}"><span class="tools"><button data-act="close" title="close ${esc(f.path)}">✕</button></span>`
    + `<div class="sub-body"></div><div class="sub-files"></div><div class="sub-foot"><span class="pill mono">📄 ${esc(f.path)}</span></div></div>`;
}

// The items a run addresses below `uid`: those with own tests, or -- with the test feature off -- the childless ones.
function leavesUnder(uid) { return [uid, ...descendants(uid)].filter((u) => (feature("test") ? item(u).is_leaf : !item(u).children.length)); }
const REVIEW_MARK = { reviewed: "✓", not_reviewed: "○", review_violated: "⚠" };
const where = (l) => `${l.path}:${l.line}` + (l.name.startsWith(l.path + "::") ? " · " + l.name.slice(l.path.length + 2) : "");

// One label per block, the rollup axes whose features are on; the tooltip explains a leaf by its bindings, a branch by its leaves.
function statusHtml(uid, it) {
  const line = (state, text) => `<div class="tip-${state}">${esc(text)}</div>`, test = feature("test"), review = feature("review");
  if (!test && !review) return `<span class="pill st-unknown"><span class="rev">▶ run</span><span class="tip">${it.problems.map((p) => line("review_violated", p)).join("")}</span></span>`;
  let tip = test ? line(it.test, it.test.replace(/_/g, " ")) : "";
  if (test && it.is_leaf) {
    tip += it.bindings.map((b) => {
      const runs = it.tests.filter((t) => t.binding === b.name), result = !runs.length ? "unknown" : runs.some((t) => !t.passed) ? "test_failed" : "test_passed";
      const site = b.locations.length ? b.locations.map(where).join(", ") : `no tagged routine yet — tag it [${uid}]${b.name ? "[" + b.name + "]" : ""}`;
      return line(result, `${b.name || "(default)"} · ${result.replace("test_", "")} · ${site}`);
    }).join("");
  }
  if (test && it.children.length) {
    const below = leavesUnder(uid).filter((u) => u !== uid), tally = new Map();
    for (const u of below) tally.set(item(u).test, (tally.get(item(u).test) || 0) + 1);
    tip += [...tally].map(([state, n]) => line(state, `${n} item(s) below ${state.replace(/_/g, " ")}`)).join("");
  }
  tip += it.problems.map((p) => line("review_violated", p)).join("");
  return `<span class="pill st-${test ? it.test : "unknown"}">` + (test ? `<span class="ball"></span>${it.test.replace(/_/g, " ")}` : "")
    + (review ? `<span class="rev ${it.review}">${REVIEW_MARK[it.review]} ${it.review.replace(/_/g, " ")}</span>` : "") + `<span class="tip">${tip}</span></span>`;
}

// The statement, then the key source files as links opening inside the block like any linked file.
function viewHtml(uid, it) {
  const sources = it.sources.length ? `<div class="block-sources md">📎 ${it.sources.map((path) => linkHtml(path, path, "")).join("")}</div>` : "";
  return `<div class="block-text md">${md(currentText(uid, "description"), "")}</div>${sources}`;
}

function testsHtml(uid, it) {
  let body = `<label class="leaf-toggle"><input type="checkbox" id="f-isleaf" ${it.is_leaf ? "checked" : ""}> carries its own <code>test</code> key</label>`;
  if (it.is_leaf) {
    body += it.bindings.map((b, i) => {
      const locHtml = b.locations.length
        ? b.locations.map((l) => '<span class="loc mono" title="' + esc(l.name) + '">' + esc(l.path) + ":" + l.line + "</span>").join(" ")
        : '<span class="miss">no tagged routine yet — tag it [' + esc(uid) + "]" + (b.name ? "[" + esc(b.name) + "]" : "") + "</span>";
      const sha = b.sha ? '<span class="sha" title="' + esc(b.sha) + '">frozen ' + esc(b.sha.slice(0, 12)) + "…</span>" : '<span class="sha">unstamped</span>';
      const records = b.records ? '<span class="note">' + b.records + " run(s)</span>" : "";
      return '<div class="binding-row"><span class="name">' + (b.name ? esc(b.name) : "(default)") + "</span>" + sha + locHtml + records
        + `<button class="unbind" data-unbind="${i}" title="remove binding">✕</button></div>`;
    }).join("");
    body += `<div class="binding-row"><input type="text" id="f-add-binding" placeholder="binding name (empty = default)" class="new-uid mono"><button id="add-binding-btn">add binding</button></div>`;
  }
  const runs = it.tests.length ? '<div class="section-label">Coverage runs</div>' + it.tests.map((t) =>
    '<details class="testrec"><summary><span class="chip st-' + (t.passed ? "test_passed" : "test_failed") + '"><span class="ball"></span>' + (t.passed ? "passed" : "failed")
    + "</span> <span class='mono'>" + esc(t.name) + "</span></summary><pre>" + esc(t.log || "(no captured output)") + "</pre></details>").join("") : "";
  return '<div class="section-label">' + esc(uid) + " tests</div>" + body + runs;
}

function renderEditor(body, uid, field, readOnly, why) {
  if (body.dataset.mode !== "edit") {
    body.dataset.mode = "edit";
    body._html = null;
    body.innerHTML = `<textarea class="block-text" spellcheck="false" placeholder="${field === "file" ? "" : "The component shall …"}" data-uid="${esc(uid)}" data-field="${field}"></textarea>`;
  }
  const text = body.firstChild;
  text.readOnly = readOnly;
  text.title = readOnly ? why : "";
  syncText(text);
  autoGrow(text);
}

// The files opened from links in `anchor` -- an item block or a file view -- each a view inside it, in the order they were opened.
function decorateFiles(container, anchor) {
  const views = [...state.files.values()].filter((f) => f.anchor === anchor), sig = views.map((f) => f.path).join("\n");
  if (container.dataset.sig !== sig) {
    const old = new Map([...container.children].map((el) => [el.dataset.file, el])), maker = document.createElement("template");
    container.replaceChildren(...views.map((f) => {
      if (old.has(f.path)) return old.get(f.path);
      maker.innerHTML = fileViewHtml(f, anchor + "#" + f.path);
      return maker.content.firstChild;
    }));
    container.dataset.sig = sig;
  }
  for (const el of container.children) decorateFileView(el, state.files.get(el.dataset.file));
}

function decorateFileView(el, f) {
  const path = el.dataset.path, editing = state.editing === path, body = el.querySelector(":scope > .sub-body");
  el.classList.toggle("editing", editing);
  if (editing && f.text != null) renderEditor(body, f.path, "file", !f.writable, "only markdown files are edited here");
  else {
    body.dataset.mode = "view";
    setHtml(body, f.error ? `<div class="block-problems">${esc(f.error)}</div>` : f.text == null ? '<div class="note">loading…</div>'
      : `<div class="block-text md">${md(currentText(f.path, "file"), dirname(f.path))}</div>`);
  }
  decorateFiles(el.querySelector(":scope > .sub-files"), path);
}

// The AI chat lives inside its item's block: log and input under the description, controls on the bottom-left border.
// An item has one chat, held by the server and shared by every block and every browser tab showing the item; a tab only keeps where it shows it.
function persistViews() { sessionStorage.setItem("syngate-ui-chat-views", JSON.stringify([...state.views])); }
function chatOf(uid) {
  const chat = { uid, log: [], session: null, turn: null, ...chatSetup(Object.keys(state.model.connectors)[0]), ...(state.chats.get(uid) || {}) };
  return state.model.connectors[chat.connector] ? chat : { ...chat, ...chatSetup(Object.keys(state.model.connectors)[0]) };
}
function chatAt(row) { return state.views.has(row.path) ? chatOf(row.uid) : null; }
const busy = (chat) => Boolean(chat.turn);
const chatInput = (path) => $("doc").querySelector(`.block[data-path="${CSS.escape(path)}"] .chat-input`);

function takeChats({ version, chats }) {
  if (version < state.chatsVersion) return;  // overtaken by a later read
  state.chatsVersion = version;
  state.chats = new Map(Object.entries(chats));
  watchChats();
}
async function reloadChats() { takeChats(await api("/api/chats")); }

// A turn runs on the server until its connector's process exits -- a subagent or workflow it launched included -- and its reply lands in the
// chat the server holds. While any turn runs, this tab keeps one long poll out for the next change of the chats, whichever tab started the
// turn, a reloaded page included; one connection serves every chat, so the page's other requests are never starved by many open chats.
const anyRunning = () => [...state.chats.values()].some((chat) => chat.turn);
async function watchChats() {
  if (state.watching || !anyRunning()) return;
  state.watching = true;
  try {
    while (anyRunning()) {
      try { takeChats(await api(`/api/chats?since=${state.chatsVersion}&wait=20`)); renderDoc(); }
      catch (err) { if (err.status) return; await new Promise((wake) => setTimeout(wake, 1000)); }  // a dropped poll (reload, sleep) is not the turn's end
    }
  } finally { state.watching = false; }
}

// Every message but the first (the content) carries its tools at the left edge; the glyphs are drawn by CSS, so the text of a message is its own.
function messageHtml(m, index) {
  const tools = m.role === "error" ? "" : `<span class="tools msg-tools">`
    + `<button class="msg-fold" aria-expanded="${!m.folded}" title="${m.folded ? "expand" : "collapse to the first line"}"></button>`
    + `<button class="msg-keep" role="checkbox" aria-checked="${!m.dropped}" title="${m.dropped ? "dropped from the exchange — click to keep" : "part of the exchange — click to drop"}"></button>`
    + `<button class="msg-child" title="make it a child item"></button><button class="msg-sibling" title="make it the next sibling item"></button></span>`;
  return `<div class="chat-msg ${m.role}${m.agent ? " agent" : ""}${m.folded ? " folded" : ""}${m.dropped ? " dropped" : ""}" data-index="${index}">${tools}`
    + `<div class="msg-body${m.role === "ai" ? " md" : ""}">${m.agent ? `<div class="msg-from">from ${esc(m.agent)}</div>` : ""}`
    + `${m.role === "ai" ? md(m.text, "") : esc(m.text)}</div></div>`;
}

// A turn's steps ride on its reply: the activity header summarises them and unfolds to one line per step, each unfolding to its content,
// an agent step to its own steps the same way. What is unfolded is this tab's, keyed by the reply's place in the log, which the running
// turn's reply takes when it lands.
const seconds = (s) => (s < 10 ? Math.round(s * 10) / 10 : Math.round(s)) + " s";
const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
const firstLine = (text) => String(text ?? "").trim().split("\n")[0];
const brief = (value) => firstLine(value && typeof value === "object" ? Object.values(value).find((v) => typeof v === "string") ?? JSON.stringify(value) : value);
const pending = (value) => (value == null ? " …" : "");

function activitySummary(steps) {
  const count = (kind) => steps.filter((s) => s.kind === kind).length;
  const files = new Set(steps.filter((s) => s.kind === "diff").flatMap((s) => s.files.map((f) => f.path))).size;
  const end = Math.max(0, ...steps.map((s) => (s.at || 0) + (s.seconds || 0)));
  const parts = [[count("tool"), "tool call"], [count("agent"), "subagent"], [count("workflow"), "workflow"], [files, "file changed", "files changed"]]
    .filter(([n]) => n).map((part) => plural(...part));
  return [...(parts.length ? parts : [plural(steps.length, "step")]), ...(end ? [seconds(end)] : [])].join(" · ");
}

function foldHtml(key, line, detail) {
  const open = state.unfolded.has(key);
  return `<div class="turn-step"><span class="step-line" role="button" aria-expanded="${open}" data-fold="${esc(key)}">${line}</span>`
    + (open ? `<div class="step-detail">${detail()}</div>` : "") + "</div>";
}

const partHtml = (label, value) => (value == null ? ""
  : `<div class="step-label">${label}</div><pre>${esc(typeof value === "string" ? value : JSON.stringify(value, null, 2))}</pre>`);

function stepHtml(step, key) {
  const kind = (label) => `<span class="step-kind">${esc(label)}</span>`;
  switch (step.kind) {
    case "tool": return foldHtml(key, kind(step.name) + esc(brief(step.input)) + (step.result == null ? " …" : step.seconds == null ? "" : " · " + seconds(step.seconds)),
      () => partHtml("input", step.input) + partHtml("result", step.result));
    case "message": return foldHtml(key, kind("message") + esc(firstLine(step.text)), () => `<div class="md">${md(step.text, "")}</div>`);
    case "reasoning": return foldHtml(key, kind("reasoning") + esc(firstLine(step.text)), () => `<div class="step-text">${esc(step.text)}</div>`);
    case "calls": return foldHtml(key, kind("calls") + plural(step.lines.length, "line"), () => partHtml("applied", step.lines.join("\n")));
    case "diff": return foldHtml(key, kind("diff") + plural(step.files.length, "file changed", "files changed"),
      () => step.files.map((f, i) => foldHtml(`${key}/${i}`, kind(f.status) + esc(f.path), () => `<pre>${esc(f.hunks)}</pre>`)).join(""));
    case "agent": return foldHtml(key, kind("agent" + (step.uid ? " @" + step.uid : "")) + esc(firstLine(step.prompt)) + pending(step.report),
      () => partHtml("prompt", step.prompt) + partHtml("report", step.report) + (step.steps?.length ? `<div class="turn-steps">${stepsHtml(step.steps, key)}</div>` : ""));
    case "workflow": return foldHtml(key, kind("workflow") + esc(brief(step.input)) + pending(step.result), () => partHtml("input", step.input) + partHtml("result", step.result));
    default: return foldHtml(key, kind(step.kind), () => partHtml(step.kind, step));
  }
}
const stepsHtml = (steps, key) => steps.map((step, i) => stepHtml(step, `${key}/${i}`)).join("");

function activityHtml(steps, key, running = false) {
  if (!steps?.length) return "";
  const open = state.unfolded.has(key);
  return `<div class="turn-activity"><span class="pill turn-head" role="button" aria-expanded="${open}" data-fold="${esc(key)}" title="${open ? "fold" : "unfold"} the turn's steps">`
    + (running ? '<span class="spinner"></span> ' : "") + esc(activitySummary(steps)) + "</span>"
    + (open ? `<div class="turn-steps">${stepsHtml(steps, key)}</div>` : "") + "</div>";
}

function toggleFold(key) {
  if (!state.unfolded.delete(key)) state.unfolded.add(key);
  renderDoc();
}

// Every block holds the reply field under its description; its hint, the log and the controls come with the open chat.
function decorateChat(el, row) {
  const chat = chatAt(row), box = el.querySelector(".block-chat"), tools = el.querySelector(".block-ai"), kept = state.chats.get(row.uid);
  el.classList.toggle("chatting", Boolean(chat));
  if (!box.firstChild) box.innerHTML = '<div class="chat-log"></div><textarea class="block-text chat-input" spellcheck="false"></textarea>';
  box.lastChild.placeholder = chat ? `Ask about ${row.uid} … (Ctrl+Enter sends)` : "";
  if (!chat) {
    setHtml(box.firstChild, "");
    setHtml(tools, kept && kept.log.length ? '<span class="pill chat-reopen" role="button" title="show the item\'s chat">▾</span>' : "");
    return;
  }
  const connector = state.model.connectors[chat.connector];
  setHtml(box.querySelector(".chat-log"), chat.log.map((m, i) => messageHtml(m, i) + activityHtml(m.steps, `${chat.uid}:${i}`)).join("")
    + (!busy(chat) ? "" : chat.steps?.length ? activityHtml(chat.steps, `${chat.uid}:${chat.log.length}`, true)
      : '<div class="chat-msg note"><span class="spinner"></span> waiting for the reply…</div>'));
  setHtml(tools, `<span class="pill chat-pill${busy(chat) ? " busy" : ""}">`
    + `<span class="chat-send" role="button" title="send (Ctrl+Enter)">➤ send</span>`
    + `<span class="rev chat-setup" role="button" title="connector · model · effort · modes">`
    + [connector.label, connector.models.find((m) => m.id === chat.model)?.name ?? chat.model, effortsOf(chat.connector, chat.model).includes(chat.effort) && chat.effort]
      .filter(Boolean).map(esc).join(" · ") + " ▾</span></span>"
    + connector.modes.map((m) => { const on = chat.modes.includes(m.id);
      return `<span class="pill chat-mode ${on ? "st-test_passed on" : "st-unknown"}" role="switch" aria-checked="${on}" data-chat-mode="${esc(m.id)}" `
        + `title="${esc(m.label)} (${esc(m.hint)}) — ${on ? "allowed" : "not allowed"}, click to toggle"><span class="ball"></span>${esc(m.label)}</span>`; }).join("")
    + (busy(chat) ? '<span class="pill chat-stop" role="button" title="stop the running turn">■ stop</span>'
      : '<span class="pill chat-close" role="button" title="hide the chat">✓</span>'));
}

// A model offers only its own effort levels, those of the connector when it lists none of its own; a model without any takes no effort.
function effortsOf(connector, model) {
  const setup = state.model.connectors[connector];
  return setup.models.find((m) => m.id === model)?.efforts ?? setup.efforts;
}
function modelSetup(connector, model, effort = null) {
  const efforts = effortsOf(connector, model);
  return { model, effort: efforts.includes(effort) ? effort : efforts.includes("medium") ? "medium" : efforts[0] ?? null };
}
function chatSetup(connector) {
  const setup = state.model.connectors[connector];
  return { connector, ...modelSetup(connector, setup.models[0].id), modes: setup.modes.filter((m) => m.default).map((m) => m.id) };
}

// Showing the chat in a block: wherever the item is shown, in this tab or another, it is the same chat.
function showChat(row, byEdit = false) {
  if (!state.views.has(row.path)) state.views.set(row.path, { uid: row.uid, byEdit });
  persistViews();
  return chatOf(row.uid);
}

function focusChat(path) {
  const input = chatInput(path);
  if (input) { input.focus({ preventScroll: true }); input.scrollIntoView({ block: "nearest" }); }
}

function openChat(row) {
  showChat(row);
  select(row.uid, row.path, { origin: "doc" });
  renderDoc();
  focusChat(row.path);
}

function hideChat(path) {
  state.views.delete(path);
  persistViews();
  renderDoc();
}

// A change to the chat shows at once and is then stored by the server, whose record every tab reads back; of changes in flight
// together only the last one's record is taken, the earlier being already behind it.
const chatUpdates = new Map();
async function updateChat(uid, patch) {
  const local = chatOf(uid), { message, ...setup } = patch, seq = (chatUpdates.get(uid) || 0) + 1;
  chatUpdates.set(uid, seq);
  if (message) { const { index, ...marks } = message; Object.assign(local.log[index], marks); }
  state.chats.set(uid, Object.assign(local, setup));
  renderDoc();
  try {
    const stored = await api(`/api/chat/${uid}`, patch);
    if (chatUpdates.get(uid) === seq) { state.chats.set(uid, stored); renderDoc(); }
  } catch (err) { toast(err.message); }
}

function toggleChatMode(chat, mode) {
  updateChat(chat.uid, { modes: chat.modes.includes(mode) ? chat.modes.filter((m) => m !== mode) : [...chat.modes, mode] });
}

// A turn: the typed text joins the log as the user's message; a statement sent from the editor is the content itself, not repeated,
// and starts the item's chat anew, the old one erased first.
async function sendChat(row, statement = null) {
  const chat = row && chatAt(row), input = chat && chatInput(row.path), text = statement ?? (input ? input.value.trim() : "");
  if (!chat || busy(chat) || !text) return;
  if (input && statement === null) input.value = "";
  state.views.get(row.path).byEdit = false;
  persistViews();
  const { uid, connector, model, effort, modes } = chat;
  try {
    const started = await api("/api/turn", { uid, connector, model, effort, modes, text, statement: statement !== null, fresh: statement !== null });
    state.chats.set(uid, started.chat);
    renderDoc();
    watchChats();
  } catch (err) { toast(err.message); }
}

function stopTurn(chat) {
  if (chat && chat.turn) api(`/api/turn/${chat.turn}/stop`, {}).catch((err) => toast(err.message));
}

// Fold, keep and extract tools of one message; dropping or keeping a message rebuilds the exchange from the kept ones on the next turn.
function messageTool(chat, row, msg, tool) {
  const index = Number(msg.dataset.index), m = chat.log[index];
  if (tool.classList.contains("msg-fold")) updateChat(chat.uid, { message: { index, folded: !m.folded } });
  if (tool.classList.contains("msg-keep")) updateChat(chat.uid, { message: { index, dropped: !m.dropped } });
  if (tool.classList.contains("msg-child")) extractItem(row, m.text, row.uid, null);
  if (tool.classList.contains("msg-sibling")) extractItem(row, m.text, row.parent, row.uid);
}

// A message becomes an item through the editor's own scaffold: its text is the body, a heading mark stripped off the first line.
async function extractItem(row, text, parent, after) {
  if (!parent) { toast("the root has no siblings"); return; }
  const description = text.trim().replace(/^#+\s*/, "");
  const kids = item(parent).children, anchor = after ? item(after) : kids.length ? item(kids[kids.length - 1]) : null, uid = suggestUid(parent);
  const next = after ? kids[kids.indexOf(after) + 1] : null;
  try {
    await api("/api/new", { uid, parents: [parent], dir: (anchor || item(parent)).folder, kind: "leaf", description, order: anchor ? anchor.order + 10 : 0 });
    if (next) await api(`/api/move/${uid}`, { from: parent, to: parent, before: next });
    state.expanded.add(parent);
    persistExpanded();
    await refresh();
  } catch (err) { toast(err.message); }
}

// The editor's send: the item is saved first and its stored statement is the user's text of the turn.
async function sendEdited(row) {
  showChat(row);
  await flushAll();
  if (drafts.size) { toast("resolve the unsaved edits first"); return; }
  state.editing = null;
  renderDoc();
  await sendChat(row, item(row.uid).description_raw.trim());
}

// Entering the reply field in the editor saves the item and waits for a message; nothing goes to the AI yet.
async function finishEditing(row) {
  showChat(row);
  state.views.get(row.path).byEdit = false;
  persistViews();
  state.editing = null;
  renderDoc();
  focusChat(row.path);
  await flushAll();
}

// The reply field is entered by click or by focus: in the editor it ends the edit, at rest it opens the chat.
function enterReply(el) {
  const row = { uid: el.dataset.uid, path: el.dataset.path };
  if (state.editing === row.path) finishEditing(row);
  else if (!chatAt(row)) openChat(row);
}

function openChatMenu(chat, anchor) {
  const menu = $("status-menu"), connector = state.model.connectors[chat.connector], efforts = effortsOf(chat.connector, chat.model);
  const mark = (on) => (on ? "● " : "○ ");
  menu.dataset.uid = "";
  menu.chat = chat;
  menu.innerHTML = '<div class="menu-label">connector</div>'
    + Object.entries(state.model.connectors).map(([id, c]) => `<button role="menuitem" data-chat-connector="${esc(id)}">${mark(id === chat.connector)}${esc(c.label)}</button>`).join("")
    + '<div class="menu-label">model</div>'
    + connector.models.map((m) => `<button role="menuitem" data-chat-model="${esc(m.id)}">${mark(m.id === chat.model)}${esc(m.name)}</button>`).join("")
    + (efforts.length ? '<div class="menu-label">effort</div>' : "")
    + efforts.map((e) => `<button role="menuitem" data-chat-effort="${esc(e)}">${mark(e === chat.effort)}${esc(e)}</button>`).join("");
  menu.showPopover();
  placeBy(menu, anchor);
}

function decorateBlock(el, row) {
  const it = item(row.uid), selected = state.panel && row.path === state.path, editing = selected && state.editing === row.path;
  el.classList.toggle("selected", selected);
  el.classList.toggle("in-sel", selected || Boolean(state.path && row.path.startsWith(state.path + "/")));
  el.classList.toggle("editing", editing);
  el.classList.toggle("branch", it.children.length > 0);
  decorateLabel(el, it);
  const body = el.querySelector(".block-body");
  if (editing) renderEditor(body, row.uid, "description", false, "");
  else {
    body.dataset.mode = "view";
    setHtml(body, viewHtml(row.uid, it));
  }
  setHtml(el.querySelector(".block-status"), statusHtml(row.uid, it));
  decorateFiles(el.querySelector(".block-files"), row.path);
  decorateChat(el, row);
}

const selectedBlockEl = () => (state.path ? $("doc").querySelector(`.block[data-path="${CSS.escape(state.path)}"]`) : null);

function renderDoc() {
  const doc = $("doc");
  state.docRows = flatten(true);
  const sig = state.docRows.map((r) => r.path).join("\n");
  if (sig !== state.docSig) {
    // Blocks are reused by path, so a block being edited keeps its fields (and, restored below, its caret) across a restructure.
    const active = document.activeElement, keep = doc.contains(active) ? { el: active, start: active.selectionStart, end: active.selectionEnd } : null;
    const old = new Map([...doc.querySelectorAll(".block")].map((el) => [el.dataset.path, el])), maker = document.createElement("template");
    const levels = [document.createDocumentFragment()];
    state.rebuilding = true;
    for (const row of state.docRows) {
      while (levels.length - 1 < row.depth) { const kids = document.createElement("div"); kids.className = "kids"; levels.at(-1).append(kids); levels.push(kids); }
      levels.length = row.depth + 1;
      if (!old.has(row.path)) { maker.innerHTML = blockHtml(row); old.set(row.path, maker.content.firstChild); }
      levels.at(-1).append(old.get(row.path));
    }
    doc.replaceChildren(levels[0]);
    if (!state.docRows.length) doc.innerHTML = '<div class="empty">nothing matches the filter</div>';
    if (keep && doc.contains(keep.el)) {
      keep.el.focus({ preventScroll: true });
      if (keep.el.setSelectionRange && keep.start != null) keep.el.setSelectionRange(keep.start, keep.end);
    }
    state.rebuilding = false;
    state.docSig = sig;
  }
  doc.querySelectorAll(".block").forEach((el, i) => decorateBlock(el, state.docRows[i]));
}

// ---- tests & review popover, opened from a tree row ---------------------------

function renderTests() {
  const pop = $("tests-pop");
  if (!pop.matches(":popover-open")) return;
  const uid = pop.dataset.uid, adding = $("f-add-binding");
  if (uid !== state.selected) { pop.hidePopover(); return; }
  if (!(adding && adding === document.activeElement && adding.value)) setHtml(pop, testsHtml(uid, item(uid)));
}

function placeBy(pop, anchor) {
  const at = anchor.getBoundingClientRect(), below = at.bottom + 6 + pop.offsetHeight <= innerHeight;
  pop.style.left = Math.max(8, Math.min(at.left, innerWidth - pop.offsetWidth - 8)) + "px";
  pop.style.top = Math.max(8, below ? at.bottom + 6 : at.top - 6 - pop.offsetHeight) + "px";
}

function openTests(row, anchor) {
  const pop = $("tests-pop");
  select(row.uid, row.path);
  pop.dataset.uid = row.uid;
  pop.showPopover();
  renderTests();
  placeBy(pop, anchor);
}

// Structure edits sit behind an explicit menu, apart from the row's one-click buttons.
function openRowMenu(row, anchor) {
  const menu = $("status-menu"), it = item(row.uid);
  menu.row = row;
  const remove = row.parent && it.parents.length > 1 ? `⊖ Remove from ${esc(row.parent)}` : it.children.length ? null : "✕ Remove";
  menu.innerHTML = (row.parent ? '<button role="menuitem" data-row-act="add-parent">⇑ Add parent</button>' : "")
    + '<button role="menuitem" data-row-act="add">+ Add child</button>'
    + (remove ? `<button role="menuitem" data-row-act="remove" class="danger">${remove}</button>` : "");
  if (menu.matches(":popover-open")) menu.hidePopover();
  menu.showPopover();
  placeBy(menu, anchor);
}

function openStatusMenu(uid, anchor) {
  const menu = $("status-menu"), it = item(uid), n = leavesUnder(uid).length, off = n ? "" : "disabled", own = leavesUnder(uid).includes(uid), below = descendants(uid).length;
  menu.dataset.uid = uid;
  menu.innerHTML = `<button role="menuitem" data-run="test" ${off}>▶ ${own ? "Run test" : `Run tests of ${n} leaf item(s)`}</button>`
    + (feature("review") ? `<button role="menuitem" data-run="review">✓ ${below ? `Mark reviewed with ${below} item(s) below` : "Mark reviewed"}</button>` : "")
    + (feature("review") && it.reviewed ? '<button role="menuitem" data-run="clear" class="danger">✕ Clear review</button>' : "");
  menu.showPopover();
  placeBy(menu, anchor);
}

function render() { renderTree(); renderDoc(); renderTests(); }

// Editing the description starts a chat: the AI controls appear with the editor, and the saved statement is the first turn when sent.
function startEditing(path = state.path) {
  if (!path || state.editing === path) return;
  state.editing = path;
  const row = state.docRows.find((r) => r.path === path);
  if (row && !row.file) showChat(row, true);
  renderDoc();
  const host = $("doc").querySelector(`[data-path="${CSS.escape(path)}"]`), text = host && host.querySelector(":scope > .block-body textarea, :scope > .sub-body textarea");
  if (!text) return;
  text.focus({ preventScroll: true });
  text.setSelectionRange(text.value.length, text.value.length);
  host.scrollIntoView({ block: "nearest" });
}

// ---- linked project files: a view inside the block of the item (or the file view) whose link opened it ----

async function openFile(path, anchor, frag) {
  const known = state.files.get(path), f = known || { path, anchor, text: null };
  f.anchor = anchor;
  state.files.set(path, f);
  renderDoc();
  if (!known) {
    try { Object.assign(f, await api(`/api/file?path=${encodeURIComponent(path)}`), { error: null }); }
    catch (err) { f.error = err.message; }
    renderDoc();
  }

AI Assassin
is a general-purpose AI assistant built around iterative analysis of the user–AI dialog and its synthesis into the directed acyclic graph of items that constructs the per-replica context, made of the Syngate subsystem holding the graph and its gate, the Synthetic AI harness core and the AI Assassin UI joining them.


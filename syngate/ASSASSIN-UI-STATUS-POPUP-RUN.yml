Run actions
of the status popup start the test, review or clear command for the item — review and clear only while the review feature is on, clear only on a reviewed item — streaming the output into the console until the command exits, where a run can be stopped and a reloaded page re-attaches to the running one.

On a branch the test run addresses every leaf below and the review, after confirmation, stamps every item below whose own review does not stand — unstamped or with a validation problem of its own — children first, then the branch, a run where none needs it being refused; a second run is refused while one is active.

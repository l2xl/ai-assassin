Synergy Context Gate (SynGate)
is the subsystem managing the project's DAG of statements, their test coverage and review status as a gate: open while every status passes, closed by anything failed.

It holds the project model — the DAG of statements and the design documents they link — the test binding, the review freeze and the status rollup. [SYNGATE.md](SYNGATE.md)

is the generic llama.cpp preset of the MI50 cards: every service of its compose project builds on the gfx906 build of llama.cpp by mixa3607, `docker.io/mixa3607/llama.cpp-gfx906:<ver>-rocm-10.1` — daily builds, the tag pinned in the compose file's `x-server` anchor.


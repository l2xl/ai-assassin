mi50-strata preset
is the generic Strata preset of the MI50 cards: its own compose project runs the gfx906 build of the Strata inference engine, not published as a ready-made image but built from the `strata` subproject of `mixa3607/ML-gfx906` against the ROCm base image, with the same cards and models folder as the llama.cpp preset, each service listening on its own loopback port.


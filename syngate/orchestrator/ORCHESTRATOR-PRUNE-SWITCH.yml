Prune switch
is a mark on every step line and AI message of the log, the user's messages aside — an icon of a page of text lines, an eye over it on what the session holds and a cross over it on what was pruned — which returns a pruned one to the session or cuts a kept one, taking effect with the chat's next message without ending the running session.

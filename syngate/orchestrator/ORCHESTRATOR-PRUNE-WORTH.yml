Pruning worth
decides when a verdict on a turn ahead of the session's tail is brought into the running session: with the next message once the provider's cache of the session expired or the cut takes out at least as many tokens as the request then resends uncached, the verdict waiting until then; a verdict on the tail is brought in at once.

Test option
`test: enabled|disabled` on the root item, off when absent. Off: the tree awaits no tests — items carry no bindings, `test` still runs the routines tagged for an item and records their coverage, and `review` stamps an item without running anything. On: items carry `test` bindings, `review` runs and freezes them, and stamps an item without a binding of its own without running anything.

Test option

`test: enabled|disabled` on the root item, off when absent. Off: the tree awaits no tests — items carry no bindings, `test` still runs the routines tagged for an item and records their coverage, and `review` stamps a childless item without running anything. On: items carry `test` bindings, `review` runs and freezes them, and an item without a binding of its own is not reviewable on its own.

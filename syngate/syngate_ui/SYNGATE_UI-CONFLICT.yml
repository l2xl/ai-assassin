Edit conflict bar
appears under the header when a save is refused for a value changed on disk and offers keep mine, which stores the typed text over the disk value, and take theirs, which drops the draft and shows the disk value; the header meanwhile reads the save state — unsaved, saving, saved at a time, or failed with a click to retry — and the edited block carries the same mark.

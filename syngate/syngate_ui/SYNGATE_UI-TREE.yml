header: Tree row
description: |
  A tree row shall show the branch collapse mark, the common status label and the title, with the one-click T test-details button and an explicit drop-down menu holding the add parent (not replace) add child and remove actions at its right, and nothing else.
  The click on the tree row itself must not activate or scroll to its content panel, double click - should scroll and activate. If the corresponding content panel is already within visible area - it must not scroll the content

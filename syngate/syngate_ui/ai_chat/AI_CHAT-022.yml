Description editor
of an item is where its chat starts: entering the editor shows the chat and its controls, so the setup is chosen before the text is saved or sent; the `✓ done` pill and Esc save the statement and leave, hiding a chat the editor opened that holds no message.

`➤ send` or Ctrl/⌘+Enter saves the statement and sends it as the first message of a new conversation of the item's chat, the previous one filed without a question — refused with a notice while a turn runs; entering the reply line instead saves the statement and waits for a message, nothing going to the AI.

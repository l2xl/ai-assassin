Description editor
of an item is where its chat starts or goes on: entering the editor shows the chat and its controls — a new, empty conversation while the item's chat is hidden, the shown one otherwise — so the setup is chosen before anything is sent; editing alone sends nothing and begins no conversation, `▴ done` and Esc saving the statement and closing the editor with the chat.

`➤ send` or Ctrl/⌘+Enter saves the statement and sends it, changed or not: as the first message of a new conversation where none is shown, the previous one filed without a question, else into the shown one as the statement's announcement; refused with a notice while a turn runs. Entering the reply line instead saves the statement and waits for a message.

Chat hide mark
is the one `▴ done` pill on the block's bottom-left border, closing in that block whatever is open — the editor, its statement saved, and the chat — and becoming `▾` there, which always opens the drop down list of the item's conversations — even a single one — the live one marked first unless it is empty, and shows none until one is picked.

A hidden chat keeps its history and session; text left in the reply line is kept by the tab and back in the line when the chat shows again, and a new conversation shown without a message sent leaves the conversations as they were.

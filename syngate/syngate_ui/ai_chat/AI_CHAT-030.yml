Chat pill
leads the block's strip, its role following the context: `▴ done` while the statement is edited, `cancel` on an open chat holding no turn yet and `▴ done` on one holding turns — each closing the editor and the chat, which keeps its history and session, and becoming `▾`, which lists the item's conversations — `■ stop` while a turn runs, and a green `➤ send` while the reply line holds text, whatever the chat's state; the strip holds no other send pill.

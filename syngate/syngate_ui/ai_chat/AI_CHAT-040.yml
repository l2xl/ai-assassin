Tree call application
of an answer goes through the item scaffold, delete and placement capabilities, `@` standing for the anchored item.

The application stops at the first refused call, whose refusal goes back to the AI as its next prompt with the results of the calls applied before it; the history shows what every batch applied, read or had refused, the reply what was applied, ran or was reported.

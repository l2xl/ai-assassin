Turn steps in order
are blocks of the log in the order they happened, with no reply chosen above them: the messages the AI said on the way are AI messages of their own, each text shown once however many ways the connection reported it, and every other step — each call of a batch and each changed file on its own — is a line of the harness that unfolds to its whole input and result; the reply is the last block, closed by the turn's activity line.


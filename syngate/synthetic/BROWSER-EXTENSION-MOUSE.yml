Mouse request
plays its sequence of steps — moves, presses, releases, clicks, double clicks, wheel turns and pauses, at viewport points or selector targets — as the user's pointer would from where the previous request left it: a move as a path of pointer moves with the hover transitions it crosses, a click where a press and its release hit one element, an HTML5 drag from a draggable element, and it answers once they have played, with the page info as it then is.

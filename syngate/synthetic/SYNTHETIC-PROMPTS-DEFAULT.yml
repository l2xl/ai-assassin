Default prompt
heads every seed context, composed from the library and deliberately not a `CLAUDE.md`: the default skills, the list of the skills on request by name and description, and every tool definition.

Each prompt text sits under a `# Prompt <path>` line naming its file, as a source does under `# Source`, and the default prompt states this format, so a turn does not read again a file the context already includes.

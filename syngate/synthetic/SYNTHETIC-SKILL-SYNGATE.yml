Syngate rules skill
is a default skill stating the rules of the DAG and its items.

One testable statement per leaf or a split into children; a statement as the thesis its covering test asserts, never repeating the design file it links; design detail kept in linked project files, each linked from exactly one item and never listed in `sources`, which hold key source files only; tests bound by tags equal to the item UID; the shape of a statement and the naming of UIDs.

Immediate interruption facility
of the Claude Code connector ends a turn the instant the stop is received: the gate of the turn closes, so no tree call, test run or delegation of it is applied past the stop, the turns it delegated are stopped with it and the test run it awaits is cancelled; the `claude` process is asked to interrupt its turn, so the model stops at once and the session records the interruption, and is killed with its process group when it has not ended within the grace period; the dispatch then fails as a connection error, and a stop received before the process is spawned spawns none.

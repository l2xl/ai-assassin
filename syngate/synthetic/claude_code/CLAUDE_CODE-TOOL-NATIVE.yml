Claude Code tool delivery
builds the schema of the structured answer from the tool definitions of the library — each tool's front matter giving its fields, its text the description of its call variant — so a tool added to the library reaches the CLI as a call of the answer schema without a change of the connector.

The tool definitions are not repeated in the seed prompt.

OpenAI-compatible API connections
are the AI connections calling an OpenAI-compatible chat completions API over HTTP or HTTPS, as many side by side as the server settings configure — MixRoute and a self-hosted llama.cpp server alike: a turn is one streamed `POST /chat/completions` request per round with the chosen model and effort, the seed context its system message and the conversation kept by the connection as its session.

